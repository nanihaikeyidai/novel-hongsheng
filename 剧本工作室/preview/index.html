\n| 6-1b | 地下车库 夜 内 | 压迫升级 | 对峙开战 | 安娜要护人独挡 → 陆沉一秒出局 | 飞刀令跑；陆沉插手；掐脖、踢飞 | 安娜会凝刃；红眼仍不够；ND 要活的 | 她说的「拖住」能拖多久？ | 陆沉红眼能吓退他 → 一脚踹昏 | 所以摆阵 |\n| 6-1c | 地下车库 夜 内 | 换招试探 | 试探/瓦解 | 被掐死局 → 喘上气，但援兵未到 | 鞋刃脱身；蓝隼封住陆沉方向；耳麦求援 | 两人有旧账；她在搬救兵 | 求援的人多久能到？ | 她开口求饶 → 她在向翠羽社报点 | 但是安娜没死 |\n| 6-1d | 地下车库 夜 内 | 假胜利 / 大压 | 能力高光 | 二阶像能翻盘 → 仍被瞬移贴脸 | 几何斩断柱；斜劈；电拳砸脸 | ★二阶凝刃的破坏力；屏字给出能力名与招式名（蓝隼是读了屏字才说出「二阶异能」） | 断柱这么强，能不能伤到他？ | 断柱＝能赢 → 他已经贴到脸前 | 所以开二阶 |\n| 6-1e | 地下车库 夜 内 | 转折收束 | 救援接手 | 要被电拳砸中 → 可撤、战场移交 | 帕斯卡扣腕带偏；令带回；自己留下 | ◆雷老板算到；ND 钓鱼；帕斯卡是谁 | 他一个人够不够？ | 没人会来 → 有人从坡道走进来 | 但是师傅到了 |\n\n**铺垫-回收账（本集）**：安娜从不轻易出手 → 本集首次凝刃高光；帕斯卡=师傅 → 关键时刻到位（到场线索提前埋在 6-1c 的耳麦求援）；陆沉「想帮」=冲动 → 被一脚踢昏，埋「独活不够」；ep05 耳机道具 → 本集复用为求援通路；翠羽社羽毛徽记 → 帕斯卡胸针的画面双通道。\n\n**本集亮点与钩子**：主亮点＝安娜二阶几何斩断柱仍打不中人；★＝几何斩断柱（全集 1 处）；◆＝帕斯卡「你带那小子回去，我陪他玩玩」（全集 1 处）。\n\n**预估**：1 大场景 5 段；说话 4 人（安娜、陆沉、蓝隼、帕斯卡）；动作节点 53 个；台词 16 句约 190 字（武戏集，台词让位给动作链）；实测时长约 110–135 秒，在 90–150 秒目标内。\n\n---\n\n## 第6集\n\n### 6-1a 地下车库 夜 内\n\n人物：安娜、陆沉、蓝隼\n\n△地下车库，冷白灯管一排排，地面黄黑停车线，远处排气扇嗡鸣。通道中央，一辆轿车引擎还在吼，车头对着坡道方向。\n\n△蓝隼站在车头灯的光里。电蓝短发，黑墨镜，石墨黑战术服，双手插兜。\n\n△驾驶座。安娜一把扣住陆沉的手腕。\n\n安娜：抓紧我。\n\n△车门弹开。两人滚落水泥地。陆沉肩背磕上地面，额角擦过水泥，闷响一声。安娜借滚势撑起半跪。\n\n△无人驾驶的轿车继续前冲，直撞蓝隼。\n\n△蓝隼没动。右拳抬起，拳峰贴上一层细密蓝白电弧。\n\n△拳落。\n\n△车头金属塌进一个拳印。\n\n△整车离地翻起来，横着砸进侧方车位，玻璃碎了一地。\n\n△烟尘散开。蓝隼抖了抖指节，墨镜反光里映出翻车残骸。\n\n【表演附注 6-1a】\n- 节拍：钩子 ｜ 场景功能：危机落地 ｜ 价值：还能用车撞 ＋ → 车废人落 －\n- 情绪线：安娜 说完就动、零犹豫（触发：车头被堵死）；陆沉 被动被拽、落地懵半拍（触发：肩膀磕地）；蓝隼 全程轻（触发：车撞过来时他没动）\n- 潜台词：「抓紧我」既是撤离指令也是保护指令；蓝隼一句话不说，比嘲讽更压人\n- 表演时机：跳车与车继续前冲压在同一拍；掀车拆「拳落→车头变形→整车离地→横砸进车位→碎玻璃」五个结果，蓝隼表情几乎不变\n- 声音：轮胎、衣料摩擦、金属塌陷、碎玻璃；引擎熄火后只剩排气扇的嗡鸣\n\n---\n\n### 6-1b 地下车库 夜 内\n\n人物：安娜、陆沉、蓝隼\n\n△安娜撑地站起，左脚前右脚后。双手抬到腰侧。\n\n△指缝间黑银色哑光能量一闪，凝成三柄短柄飞刀。刃面无彩光、无粒子，只剩冷金属质感。\n\n△她侧过半张脸，眼睛仍锁着蓝隼。\n\n安娜：快跑，我拖住他。\n\n△陆沉爬起半寸。虹膜骤然烧成赤红。白衬衫下摆被一股无形的气浪掀起来。他咬牙，拳握紧，肩线朝前。\n\n陆沉：我来帮你。\n\n△安娜头也不回。\n\n安娜：笨蛋。\n\n△话音未落。蓝隼刚才还在三米外，此刻已经贴到安娜面前。\n\n△他单手掐住安娜脖颈，整条手臂上举。安娜双脚离地，靴尖在空中蹬了两下。她两手死死扣住蓝隼前臂，指节发白；飞刀还夹在指间，一时甩不出角度。\n\n△陆沉一拳砸向蓝隼肋侧。\n\n△蓝隼头都没偏。他抬膝，一脚踹中陆沉胸口。\n\n△陆沉整个人飞出去，后背撞上侧方车位的翻车车身，滑坐下去。赤红从眼底褪成一线，头一歪，昏过去。\n\n△蓝隼的墨镜转向陆沉。镜面里那点红正在褪。\n\n蓝隼：赤瞳。……难怪上面要活的。\n\n【表演附注 6-1b】\n- 节拍：压迫升级 ｜ 场景功能：对峙开战 ｜ 价值：安娜要护人独挡 ＋ → 陆沉一秒出局 －\n- 情绪线：安娜 命令式甩开陆沉（触发：「快跑」）；陆沉 冲动插手（触发：看见她摆阵）；安娜「笨蛋」是怒不是嫌（触发：他把赤瞳亮出来）；蓝隼 从随意到认出目标（触发：镜面里那点红）\n- 潜台词：「我来帮你」= 十七岁的逞强；「笨蛋」= 你活着比你帮忙重要；「难怪上面要活的」= 陆沉在蓝隼眼里是货，不是人\n- 表演时机：飞刀黑银哑光，禁止彩色粒子；红眼在「我来帮你」前半拍点亮；掐喉与踢飞分成两条动作链，各写各的主行动者；赤瞳那句前留一拍，蓝隼先把墨镜转过去\n- 声音：安娜「笨蛋」短促怒吼；出拳破风；踹中胸口闷响；后背撞车身；蓝隼说赤瞳时语气平，不带情绪\n\n---\n\n### 6-1c 地下车库 夜 内\n\n人物：安娜、蓝隼、陆沉（昏迷不语）\n\n△安娜靴底一线黑银光一闪——鞋尖凝出短刃。\n\n△她借悬空拧腰，短刃朝蓝隼持喉那只手的腕侧划去。\n\n△蓝隼手腕一松，侧身让开刃锋，同时放手。\n\n△安娜落地，单膝触地，一手按住脖子，猛咳两声。额发湿贴，汗沿鬓角往下滚。\n\n△蓝隼退后半步，把手插回口袋。\n\n蓝隼：小安娜，多年不见，流系异能用的越来越熟练了啊。\n\n安娜：少废话。\n\n△她甩腕。三柄飞刀连环掷出，黑银轨迹贴地掠向蓝隼面门与肩窝。\n\n△蓝隼抬起左手，掌缘一带——叮、叮、叮。飞刀被拍飞，钉进坡道一侧一辆停着的车的车门，颤了两下，刃体开始溃散成灰银雾。\n\n蓝隼：投降吧，我不想欺负小孩，就这点程度是伤不到我的。\n\n△安娜没有看他。她抬手按住耳里的耳机，侧过脸，压着嗓子。\n\n安娜：目标在我这儿，速来。\n\n△耳机里只有一声很轻的电流接通响，没有回话。\n\n△安娜的视线扫向翻车残骸那边。蓝隼不紧不慢横移一步，正好挡在她和陆沉之间。\n\n【表演附注 6-1c】\n- 节拍：换招试探 ｜ 场景功能：试探/瓦解 ｜ 价值：被掐死局 － → 喘上气但援兵未到 ＋－\n- 情绪线：安娜 从窒息挣扎 → 落地咳血仍抬眼（触发：咳完第一口）；蓝隼 认出旧识后改用玩笑（触发：「小安娜」）→ 用身体封死她够到陆沉的路（触发：她看向残骸）\n- 潜台词：耳麦那句是向翠羽社报点，不是求饶；「小安娜」= 旧账 + 等级压制；「投降吧」= 他要的是活的，所以不急着杀她\n- 表演时机：鞋刃只闪一线黑银，不拉长特效；耳麦句说得又快又低，不给蓝隼反应时间；横移挡位那一步要慢，让观众看清楚；陆沉在残骸边昏迷入画余光即可，不抢戏\n- 声音：咳、鞋刃破风、耳麦接通的一声轻响、三记金属声、刀体溃散的细响；蓝隼语调轻浮上扬\n\n---\n\n### 6-1d 地下车库 夜 内\n\n人物：安娜、蓝隼\n\n△安娜抹了一把额汗，重新站直。她双手合拢又拉开——黑银色能量在掌心拉长、压薄，凝成一柄长刀。刀脊哑光，无彩晕。\n\n安娜：小看我可会吃亏的。\n\n△安娜的嘴闭着，不动。四个青绿描边黑体汉字「二阶凝刃」贴在她肩旁，字形与参考图 ref_二阶凝刃.png 完全一致；笔画边缘向上飘散着青绿幽灵火焰。\n\n△蓝隼的墨镜朝她耳边转了一下，又转回她脸上。他把插在口袋里的手抽出来。\n\n蓝隼：二阶异能，有意思，让我看看是什么招式。\n\n△安娜手腕一抖。刀尖极快划出一道直线，那道直线在半空折成一个三角形边框。\n\n△安娜的嘴闭着，不动。三个青绿描边黑体汉字「几何斩」贴在她持刀那一侧的肩旁，字形与参考图 ref_几何斩.png 完全一致；笔画边缘向上飘散着青绿幽灵火焰。\n\n△三角剑气脱离刀尖，带着黑银锋线朝蓝隼胸口飞去。\n\n△蓝隼身形往左一晃，人已错开半个车位。剑气擦着他衣角飞过——\n\n△剑气继续朝坡道方向切去。坡道一侧的水泥柱齐腰断开，上半截错位塌斜，钢筋外露，灰烟爆开。巨大断裂声砸满整个车库。★\n\n△安娜不等烟散，刀锋再起，朝右侧斜劈一道直线剑气。\n\n△蓝隼再次瞬移。再出现时，已站在安娜面前半臂距离。\n\n蓝隼：看来还是只有这点雕虫小技啊。\n\n△他右拳握紧。蓝白电弧从指节爬上手背，拳峰嗡地亮了一下。\n\n△拳朝安娜面门砸下。\n\n【表演附注 6-1d】\n- 节拍：假胜利 / 大压 ｜ 场景功能：能力高光 ｜ 价值：二阶像能翻盘 ＋＋ → 仍被瞬移贴脸 －－\n- 情绪线：安娜 咬牙开二阶（触发：听出「就这点程度」的轻视）；蓝隼 从好奇（触发：二阶）→ 兴趣消退（触发：断柱只断了柱）→ 收网（触发：听见耳麦那声接通响）\n- 潜台词：几何斩断柱 = 给观众看她能伤结构、伤不到他；墨镜朝耳边转那一下 = 他听懂了求援，所以不再等；电拳 = 处决预告\n- 表演时机：挥刀用「残影 + 折线成三角」表达，不写成慢动作咏唱；断柱声盖过一切；记忆锚点落在断柱的结果拍；电弧起势与出拳分两拍，别合成一个动作\n- 屏字处理（两处上屏文字 · 按 ep05「危险通话」先例）：①「二阶凝刃」——**必须等安娜说完「小看我可会吃亏的。」之后才出**，紧贴安娜肩旁，出屏字那一镜安娜**嘴闭、无声（ZERO speech）**；②「几何斩」——**在挥刀折出三角之后、剑气脱手之前出**，紧贴安娜持刀那一侧的肩旁，与任何台词都不重叠；③ 两处屏字**不得同时出现、不得挤在同一镜、不得居中漂浮、不得出现在蓝隼或任何别处**，只能贴在安娜身上；④ 字形一律绑定参考图 `ref_二阶凝刃.png` / `ref_几何斩.png`（纯黑底、青绿描边黑体中文、笔画边缘向上飘散青绿幽灵火焰），由资产生成阶段单独出纯文字参考图作独立 `<Picture N>` 喂进视频，让画面里的字严格等于参考图，防模型自造伪汉字；⑤ 屏字片段**单独生成 negativePrompt**，移除默认的禁文字项，改为「禁止出现参考图以外的任何其他文字／字符／伪汉字」，且 `timeline_data.segments[N].negativePrompt` 与 `timeline_data.batchWorkspaces.r2v.segments[N].negativePrompt` 必须完全一致\n- 声音：能量凝刀的短促嗡鸣；断柱轰响；电弧噼啪；蓝隼近身时呼吸几乎贴耳\n\n---\n\n### 6-1e 地下车库 夜 内\n\n人物：安娜、蓝隼、帕斯卡、陆沉（昏迷）\n\n△电拳落到安娜面前半尺——被一只手扣住腕骨，往外一带。\n\n△拳锋擦过安娜耳侧砸在水泥柱上。柱面炸开一片碎屑，电弧顺着钢筋窜进混凝土，暗了。\n\n△那只手扣着带电的手腕没松。电弧在两只手背之间噼啪乱窜，谁也没退。\n\n△金发男人从坡道方向走进灯里。考究外套，胸前一枚银色羽毛胸针。右手捏着半杯红酒，视线落在蓝隼脸上。\n\n帕斯卡：手挺快。\n\n△安娜横在身前的黑银长刀还没散。\n\n安娜：帕斯卡。\n\n△蓝隼的嘴角往上抬了一点。\n\n安娜：雷老板让你来的？\n\n帕斯卡：看来雷老板算到了啊，果然 ND 想利用那小子钓鱼。你带那小子回去，我陪他玩玩。◆\n\n△帕斯卡松开手。蓝隼收回拳，指节上的电弧一节节暗下去。\n\n△安娜横着的长刀散成灰银雾，落地。她点头，冲回翻车残骸边，把陆沉的一条手臂架上肩。\n\n△安娜半拖半架着陆沉退向坡道。\n\n△帕斯卡转回身，把酒杯举到唇边。蓝隼指节上的电弧重新亮起。\n\n【表演附注 6-1e】\n- 节拍：转折收束 ｜ 场景功能：救援接手 ｜ 价值：要被电拳砸中 － → 可撤、战场移交 ＋＋\n- 情绪线：安娜 从死线窒息 → 见师傅到位才敢卸力（触发：看见帕斯卡的手扣住那只腕）；帕斯卡 轻浮外壳、拦拳时手指极稳（触发：把电拳带偏）；蓝隼 兴趣从「小孩」转到「像样的对手」（触发：帕斯卡开口）\n- 潜台词：锁定句同时交三件事——雷老板有预判、ND 在钓鱼、你们撤我留下；红酒只作人物识别，不妨碍拦拳；「雷老板让你来的」是安娜在确认自己被安排\n- 表演时机：先给画外那只手扣腕，再让人脸入灯；拦拳靠技巧不靠新设定——电拳被带偏后顺着钢筋导进柱体，电弧自灭；安娜接令立刻执行带走，不站着谢师傅；陆沉全程无对白\n- 声音：电弧被压住的滋啦、碎石炸开；红酒杯随步伐轻晃；安娜拖人时的脚步与喘息；坡道口的风声\n\n---\n\n## 剧情梗概（起承转合）\n\n- **起**：安娜带陆沉跳车；轿车冲上去，蓝隼一拳把车掀翻，人被截停。\n- **承**：安娜凝刃令陆沉跑；陆沉红眼插手被一脚踹昏；鞋刃脱身；旧识调侃；飞刀被拍飞；她按住耳麦向翠羽社报点，耳机只回一声接通响。\n- **转**：二阶凝刃·几何斩断柱（★），仍被瞬移近身；蓝隼听见求援，改用杀招，电拳砸脸。\n- **合**：帕斯卡扣腕带偏电拳；令安娜带陆沉回社，自己留下陪蓝隼玩（◆）；安娜架着陆沉退向坡道。\n\n## 审稿记录\n\n> 本轮为定稿修订（2026-11-10）。上轮（2026-11-07）条目已逐条并入下列八条，不再单列。\n> 仍生效的锁定项：蓝隼人称一律用「他」；本集武戏口径（徒手掀车／瞬移近身／拳头带电）优先于旧「神经干扰丝」设定；凝刃为黑银色哑光、无彩色粒子；★ 落在几何斩断柱，◆ 落在帕斯卡「你带那小子回去，我陪他玩玩」；帕斯卡水系本集不展开。\n\n1. **前提不成立（最严重）：高潮靠外援，且帕斯卡到场毫无公平线索。** 证据：6-1e 全场；6-1a–6-1d 无任何铺垫。story-engine 前提测试「选择」项的失败信号就是\"靠巧合、新设定或外援收尾\"；帕斯卡同时还替观众口述了真相（「看来雷老板算到了啊」），正是 scene-engine 列为失败模式的\"角色口述真相，揭完只震惊\"。→ 改法：在 6-1c 加安娜按耳麦求援（「目标在我这儿，速来。」）并写\"耳机里只有一声很轻的电流接通响\"；6-1d 开头写\"蓝隼的墨镜朝她耳边转了一下\"——他听见了，所以放弃观望改用杀招，电拳因此有了新动机；6-1e 帕斯卡从坡道方向进来，到场来源明确为\"接到了求援\"而非巧合。耳麦沿用 ep05 已有道具，不新增资产。\n2. **因果断（空间硬冲突）：陆沉昏在柱下，而 6-1d 被斩断的正是那根柱。** 证据：6-1b「后背撞上水泥柱」／6-1d「后方一根水泥柱齐腰被切断」／6-1e「她撤步到水泥柱旁，架起昏迷的陆沉」。原稿里陆沉会被自己身旁断掉的柱子压住。→ 改法：陆沉改为被踹飞后撞上侧方车位的翻车车身（6-1b）；被斩断的柱明确在坡道一侧、也就是蓝隼身后（6-1d）；6-1e 改为\"冲回翻车残骸边\"接人。三处空间关系自洽。\n3. **讲不清：6-1a 全场无台词，前 15 秒没有目标与赌注。** 证据：6-1a 六个 △ 零对白。clarity.md 要求 90s 片前 15 秒交代四件事；原开场只让观众看见\"一辆车撞人然后被掀翻\"。→ 改法：加安娜一句「抓紧我。」放在跳车前（配\"扣住陆沉手腕\"的动作），交代她要带人走；再加 6-1b 蓝隼一句「赤瞳。……难怪上面要活的。」用画面（红眼熄灭）＋台词双通道交代赌注是\"ND 要活的\"，并提前埋下帕斯卡锁定句里的\"钓鱼\"。\n4. **讲不清：「雷老板」是全剧首次出现的机构称谓，帕斯卡本人也是首次露面。** 证据：6-1e 帕斯卡锁定句。clarity.md 要求人物关系在第一次互动就点明；原稿用\"△帕斯卡。\"这种动作行当名字卡，观众既不知道他是谁，也不知道\"雷老板\"是谁。→ 改法：由安娜先叫「帕斯卡。」完成命名，再问「雷老板让你来的？」一句话点明上下级关系，同时给帕斯卡的锁定句一个落点（他答\"雷老板算到了\"）；帕斯卡胸前的银色羽毛胸针与翠羽社徽记对应，作画面双通道。原句一字未动。\n5. **格式与可拍：△ 行里混进了镜头语言与作者解读。** 证据：6-1b「像画面被掐掉一帧」、6-1d「下一帧已站在……」、6-1e「电拳落到画面边线外半寸」、6-1c「像刚结束一次热身」。前三条是\"画面/下一帧/画面边线\"这类分镜语，第四条是编剧解读。→ 改法：分别改为\"蓝隼刚才还在三米外，此刻已经贴到安娜面前\"\"再出现时，已站在安娜面前半臂距离\"\"电拳落到安娜面前半尺\"；\"像刚结束一次热身\"从 △ 删除，语义移入表演附注。\n6. **台词假：蓝隼三句评语同强度、同句式，连续三拍重复\"我比你强\"。** 证据：6-1c「投降吧，我不想欺负小孩……」、6-1d「有意思，让我看看是什么招式」、6-1d「还是只有这点雕虫小技」。emotion-rhythm 的收益递减律下，连续同质评语第三次观众就麻了。台词锁定不能改，就用表演分层解决。→ 改法：在附注里把三句分成三档——6-1c 是俯身逗小孩的漫不经心，6-1d 第一句是第一次认真（手从口袋里抽出来），6-1d 第二句是兴趣消退、开始收网（紧接着电拳）。三句各自带出不同信息，不再是同一种压制。\n7. **没意思：6-1c 与 6-1d 连着两场都是\"安娜出手→被轻松化解\"，只有强度差没有性质差。** → 改法：把 6-1c 的落点改成\"援兵接通但人还没到\"的假胜利（她抬手按住耳机，蓝隼同时横移一步封死陆沉方向——希望刚起就被压住），让 6-1d 的 ★ 断柱真正承担\"放\"；策略阶梯（跳车→飞刀→鞋刃→二阶）不变，但每段离场的局面都变。\n8. **时长与可拍成本：** 按最终稿 53 个动作节点、16 句台词约 190 字测算，成片约 110–135 秒，落在 90–150 秒目标区间内，无需再砍。不加新场景、不加新人物、不换新道具（耳麦＝ep05 已有耳机；红酒杯改为全程握在手里，删掉原稿\"搁到最近车盖上\"的悬空动作——车已被掀翻，现场没有可用车盖）。凝刃全程黑银哑光，无彩色粒子。\n9. **两处上屏文字与项目「排除：可读细字屏幕」相抵（原写法不可执行）。** 证据：6-1d 原「△上屏文字：「二阶凝刃」」「△上屏文字：「几何斩」」两行只有字、没有可执行规格（谁身上、什么时候出、什么字形、参考图从哪来都没写），而《项目.md》「声音与视觉」栏排除「可读细字屏幕」，两条规则直接打架。→ 改法：按用户决定「参考危险通话处理方式」——屏字**保留**，处理方式照 ep05 P09 片段实跑通的先例逐条照搬：① **先出文字参考图**：由资产生成阶段先做纯文字参考图 `ref_二阶凝刃.png` / `ref_几何斩.png`（**纯黑底**；**青绿色（teal-cyan）描边**的**黑体中文**；笔画边缘带**向上飘散的青绿幽灵火焰/烟雾**；无衬线、无渐变、无描边阴影；纯文字居中横排），作独立 `<Picture N>` 喂进视频，让画面里的字严格等于参考图上的字——**防伪汉字**（P15 教训：单靠 `no readable text` 挡不住模型自造伪汉字，必须给参考图）；② **出现在谁旁边**：必须紧贴**对应人物**——「二阶凝刃」与「几何斩」都是安娜的，**贴在安娜身上**，绝不居中漂浮、绝不贴到蓝隼或空无一人处；③ **时序**：P09 铁律「说完再出屏字」——「二阶凝刃」在安娜说完「小看我可会吃亏的。」之后才出；「几何斩」在挥刀折出三角之后、剑气脱手之前出；两处不同时出现、不与任何台词重叠，出屏字那一镜 **ZERO speech**（嘴闭、无声）；④ **negativePrompt 侧**：屏字片段**单独生成** negativePrompt，把项目默认的「禁止字幕、禁止画面文字、禁止中文字符、禁止标题卡」**移除**，替换为「禁止出现参考图以外的任何其他文字／字符／伪汉字」；每个片段的 negativePrompt 单独生成且不得为空，`timeline_data.segments[N].negativePrompt` 与 `timeline_data.batchWorkspaces.r2v.segments[N].negativePrompt` 必须完全一致（《H3提示词生成前必读与标签门禁.md》）。**相抵关系写进《项目.md》**：以保留屏字为准，「排除：可读细字屏幕」改为默认排除、**仅 ep06 6-1d 两处例外**。本条只改屏字的写法与落位，台词、动作链、场次结构、★◆ 位置、动作节点 53、台词 16 句约 190 字、实测 110–135 秒全部未动。\n\n## 修订记录\n\n- 2026-11-07：按用户锁定事件重写为地下车库战完整稿；回社线迁 ep07。\n- 2026-11-10：定稿修订——修空间硬冲突（陆沉落点／断柱方位／接人位置）；补帕斯卡到场的公平线索（6-1c 耳麦求援 + 6-1d 蓝隼听见）；补首场台词与 ND 赌注（6-1a「抓紧我」、6-1b 赤瞳句）；6-1e 补人物命名与「雷老板」关系点明；清除 △ 内镜头语言与作者解读；帕斯卡拦拳改为扣腕带偏、力量来自技巧；补剧本头、分场表新增观众预测/问题两列；实测时长 110–135 秒，仍在 90–150 秒目标内。用户锁定台词 10 句逐字保留、顺序与说话人未动；新增台词 6 句填在原句之间。\n- 2026-11-11（口径统一 · 用户决定）：① **陆沉服装**按 ep04 起成片正典与《人物视觉锚点表.md》统一为「白衬衫（袖口挽到手肘）＋深色长裤＋白运动鞋」——本集人物状态表与 6-1b「白衬衫下摆」两处改写；**禁写蓝白运动校服**（ep05 早期误用已废弃）；② **6-1d 两处上屏文字保留**，写法改按 ep05「危险通话」先例（先出纯文字参考图 `ref_二阶凝刃.png` / `ref_几何斩.png` 并绑定 `<Picture N>`、紧贴安娜身上、说完再出、出屏字那一镜 ZERO speech、屏字片段单独生成 negativePrompt 并移除默认禁文字项）；「二阶凝刃」落在安娜说完「小看我可会吃亏的。」之后，「几何斩」落在挥刀折出三角之后、剑气脱手之前。台词、△ 动作链、场次结构、★◆ 位置、动作节点 53、台词 16 句约 190 字、实测 110–135 秒全部未动。\n"}, {"id": "ep07", "meta": {"id": "ep07", "title": "陆沉回社", "status": "定稿", "updated": "2026-11-11", "duration_target": "90-150s", "aspect": "16:9", "premise": "进社不是保护，是「你终于没法独活」——自主权冲突；父/陈玥残页仅钩子", "open": "接 ep06 帕斯卡殿后；7-0 用坡道雨夜与车程把「昏迷」交代成「清醒、湿透、已知追猎者身份」；安娜带陆沉回翠羽社落地；不重拍车库战"}, "markdown": "# 《红绳》第7集 · 陆沉回社\n\n```yaml\nid: ep07\ntitle: 陆沉回社\nstatus: 定稿\nduration_target: 90-150s\naspect: \"16:9\"\nupdated: 2026-11-11\npremise: 进社不是保护，是「你终于没法独活」——自主权冲突；父/陈玥残页仅钩子\nopen: 接 ep06 帕斯卡殿后；7-0 用坡道雨夜与车程把「昏迷」交代成「清醒、湿透、已知追猎者身份」；安娜带陆沉回翠羽社落地；不重拍车库战\n```\n\n> 格式：豆包同款。画幅 16:9。高精度日漫电影感。\n> 场景：7-0 地下车库（复用 SCN-GARAGE）｜7-1、7-2 翠羽社大厅（SCN-CY-HALL）｜7-3 翠羽社侧廊（SCN-CY-CORRIDOR）。**本集未新增场景资产。**\n> 用户锁定台词逐字保留（只规范标点）：★「你们救我，不等于我听你们的。」◆＝侧廊旧档那一角（陆沉看见、没碰、没说破）。\n\n---\n\n## 剧本头（项目级，本集沿用）\n\n类型：多集短剧\n风格：冷调石构地下空间 + 雨夜湿冷；高精度日漫电影感；拱窗余光与主座纵深\n标签：都市校园悬疑 + 异能动作 + 机构管控 + 自主权冲突\n人设：习惯独活、要自己查清母亲死因的十七岁赤瞳少年 × 把「保护」做成「管控」的地下反抗组织\n单集时长：约 115–135 秒 ｜ 剧作基调：钩子驱动 ｜ 画幅：16:9\n\n---\n\n## 本集梗概\n\n- **目标**：陆沉在翠羽社落地后保住查案自主权。\n- **阻力**：雷斯特要他留下、配合；安娜用「救命」换听话空间。\n- **策略变化**：沉默跟走 → 明确拒绝被安排。\n- **高潮**：★「你们救我，不等于我听你们的。」\n- **结果**：人暂留社内，只谈成「墙内过夜」这一条；心不交权。\n- **下一钩子**：◆ 侧廊旧档墙上一角，露着「陈玥」两个字。\n\n## 本集人物状态\n\n| | 开场 | 结尾 |\n|---|---|---|\n| 陆沉 | 昏迷，被安娜半拖半架退向坡道；额角擦伤、肩背磨破、白衬衫湿透混灰 | 清醒；暂留墙内；自主权立住；已看见「陈玥」的名字，没说破 |\n| 雷斯特 | 等救人结果；准备安置条款；对「追猎者被甩掉」毫无反应 | 善意受阻；把底线退到「只留墙内过夜」；开始重新估量陆沉 |\n| 安娜 | 执行态余波；拖人上车；车程里只报情报不安慰 | 夹在社长与陆沉之间；用「旧档。别碰。」替社里封了一次口 |\n| 帕斯卡 | 留在车库与蓝隼对峙 | 本集不出画 |\n| 沈默 | 本集不出画 | — |\n\n---\n\n## 分场表\n\n| 场次 | 场景 时间 内外 | 节拍 | 场景功能 | 入场→离场 | 主攻防 | 观众新知道 | 与上一场 |\n|---|---|---|---|---|---|---|---|\n| 7-0 | 地下车库 夜 内 | 钩子 | 开场钩子 / 信息交底 | －（昏迷被拖着走）→ ＋（醒着开口问） | 目标：安娜把人和追猎者一起甩掉｜策略：拖到坡道、塞车、走雨夜｜反制：车一颠把人颠醒，醒的人开始问｜转折：陆沉醒来第一句问的是敌人，不是自己 | 追猎者是谁；帕斯卡留下断后；他们要回翠羽社 | （接 ep06）所以从坡道撤 |\n| 7-1 | 翠羽社大厅 夜 内 | 冲突确立 | 关系亮相 / 安置 | ＋（活着进社）→ －（条款压下来） | 目标：雷斯特要他留下、配合｜策略：先给换衣热水，再把「只要你活着站在这儿」当条件｜反制：陆沉不接安置也不道谢，只问一句「你们要什么」｜转折：雷斯特不答，把更大的条件留到下一拍 | 翠羽社的大厅与社长；追猎者没跟上来；安置条款开始 | 所以他进了门 |\n| 7-2 | 翠羽社大厅 夜 内 | 压迫升级 + 转折 | 对峙 / 谈判 | －（条款逼到面前）→ ＋（条件由他自己划） | 目标：雷斯特要「留下并配合」｜策略：用 ND 的威胁、用安娜的救命账夹击｜反制：陆沉先拒「管我的脖子」，再拒「问完了」，最后钉死★｜转折：雷斯特让出底线，改成只要他墙内过夜 | 保护必附带管控；档案可能就在这里；陆沉只肯自己查 | 所以条款砸下来 |\n| 7-3 | 翠羽社侧廊 夜 内 | 收尾钩子 | 信息诱饵 | ＋（名字就在眼前）→ －（看得到、碰不得、不能说） | 目标：安娜把人送进客房并立规矩｜策略：走快、用「旧档。别碰。」封口｜反制：陆沉看懂了、没碰、没说破，把名字记住了｜转折：纸角上那两个字是「陈玥」 | 陈玥的名字就在侧廊旧档上；翠羽社有档案、有规矩，也有知道的沉默 | 但是他走过旧档墙时，看见了一个名字 |\n\n**铺垫-回收（本集）**：ep04「我自己会查清楚」→ 本集对抗「我们替你查／你先留下」；ep05 安娜「今晚把你带活的回来」→ 本集雷斯特「今晚只要你还活着，站在这儿」；ep06 蓝隼与帕斯卡 → 本集只报结果，不给战果（留给后续集）。残页只埋不收。\n\n**观众预测与打破（本集）**：\n1. 预测「醒来会先问自己伤在哪／被审一遍」→ 打破：7-0 他第一句问的是「谁在追」，主动权抢在机构前面。\n2. 预测「★之后会被安排一切、逐步收编」→ 打破：他只点头接受「墙内过夜」一条，幅度极小，像接一张临时床不像接合同。\n3. 预测「看见母亲的档案会扑上去追问」→ 打破：7-3 他看见、没碰、没说破，进门前只转头看了一眼左侧那面旧档墙。\n\n**预估**：4 场（1 个既有场景复用 + 2 个既有场景）；说话 3 人（陆沉、安娜、雷斯特）；台词 363 字；△ 节点 29 条；估时 115–135 秒。\n\n---\n\n## 第7集\n\n### 7-0 地下车库 夜 内\n\n人物：陆沉、安娜\n\n△坡道口一半露天。雨从口子上泼下来，顺着坡道淌成薄薄一层水。\n\n△安娜半拖半架着陆沉退上来。雨浇在他肩上头发上，混着汗和灰。他垂着头，没醒。\n\n△她把他塞进坡道顶端那辆深色车的后座，带上车门。\n\n△车身一颠，陆沉的头磕在椅背上，猛地睁眼。他抬手抹脸，指腹上是灰和血。\n\n陆沉：……谁在追。\n\n安娜：ND 的追猎者，姓蓝隼。我师傅留下对付他，他追不到这儿。\n\n陆沉：……我们这是去哪儿。\n\n安娜：翠羽社。\n\n△车停。安娜拉开后座门。陆沉撑着门下车，肩膀晃了一下，站住。\n\n【表演附注】\n- 节拍：钩子 ｜ 场景功能：开场钩子 / 信息交底 ｜ 价值：－（昏迷被拖着走）→ ＋（醒着开口问）\n- 情绪线：陆沉 昏迷（触发：被拖过坡道）→ 被颠醒（触发：头磕在椅背上）→ 先问「谁在追」（触发：清醒后的第一反应是先搞清楚敌人）→ 再问「去哪儿」（触发：确认自己被带去了别人选的地方）；安娜 全程执行态，不安慰、不解释多余\n- 潜台词：陆沉问「谁在追」＝十七岁的第一反应是敌人，不是自己；安娜说「他追不到这儿」＝安抚被压缩成一条情报\n- 表演时机：醒来只给「睁眼 + 抬手抹脸」，不要喊疼；下车时肩膀晃一下，随后自己站住——身体差，但站得住\n- 声音：坡道雨声压过车库回声；车门两声闷响；车轮碾过积水；陆沉声音哑而短\n- 衔接备注：本场是纯转场，△ 动作共 5 条约 150 字，不演车库战、不出帕斯卡与蓝隼的画面；擦伤来自 ep06 摔在水泥地上那次翻滚，本集不新增新伤。**车辆口径（三辆车不得互相误认）**：① ep06 被蓝隼掀翻、陆沉滑坐在旁的轿车，在**左侧侧方车位**；② ep06 6-1c 飞刀钉住的那辆停着的车，在**坡道一侧**；③ 本场坡道顶端这辆**深色车**，是撤离用车，与前两辆不是同一辆。取景避开车库深处残骸，三车不同框。\n\n---\n\n### 7-1 翠羽社大厅 夜 内\n\n人物：陆沉、安娜、雷斯特\n\n△门外雨声猛地被石墙切短。铁门在身后合上，水声只剩鞋底与地面的黏响。\n\n△陆沉站在门内两步远。白衬衫湿透贴在肩背，磨破一块，翻着灰白。额角一道擦伤，血和雨混在一起。碎发贴额，水珠沿下颌线往下掉。他没有擦。眼睛先扫拱窗、主座、墙上翠羽徽记，最后才落回前方。\n\n△安娜侧身半步，让开他与主座之间的直线。袖口还潮着，呼吸已经压平。\n\n△纵深尽头，雷斯特坐在主座。银灰发，黑衣，胸前羽毛胸针在拱窗余光里亮了一下。指节在桌沿点一下，停住。\n\n雷斯特：回来了。\n\n△陆沉不接话。肩线绷着，像还在听门外有没有第二组脚步。\n\n安娜：追猎的甩在车库了，我师傅断后，没跟上来。他半路自己醒的。\n\n雷斯特：先把身上的水擦干。客房在侧廊第二间，干净衣服和热水都备好了。\n\n△陆沉抬眼看他。停半拍。\n\n陆沉：你们要什么。\n\n△雷斯特没立刻答。他看了一眼安娜，又看回陆沉，肩线仍松着，像在交代一件已经想清楚的事。\n\n雷斯特：今晚——只要你还活着，站在这儿。\n\n△陆沉喉结动一下。鞋底的水在石板砖上洇开一小圈。\n\n【表演附注】\n- 节拍：冲突确立 ｜ 场景功能：关系亮相 / 安置 ｜ 价值：＋（活着进社）→ －（条款压下来）\n- 情绪线：陆沉 戒备扫场（触发：进门落位）→ 最短质问（触发：换衣热水被当成安排）；雷斯特 全程淡定，唯开场指节敲桌沿一下是唯一泄出来的紧（触发：听说追猎者被甩掉，他一点都不意外）；安娜 执行收束，只汇报不表态\n- 潜台词：陆沉问「要什么」＝不承认这是无条件的保护；雷斯特「只要你活着」＝把更大的条件留到下一拍；安娜那句「他半路自己醒的」＝把陆沉交到社长手上，同时提醒社长这孩子醒着\n- 表演时机：陆沉进门先扫空间再看人；水珠掉下颌时不擦；问句前半拍停顿；雷斯特答话前先看安娜一眼\n- 声音：雷斯特低、稳、不演讲；陆沉声短、偏哑；大厅有一点石壁回声；安娜汇报语速比平时快半拍\n- 衔接备注：「湿透」的成因由 7-0 坡道雨夜给出（雨浇 + 汗 + 灰），本场不再解释；「观察室／门卫」是 ep05 已经演过的旧事，本场改为汇报 ep06 结果\n\n---\n\n### 7-2 翠羽社大厅 夜 内\n\n人物：陆沉、雷斯特、安娜\n\n△雷斯特起身，绕过主座一角，停在距离陆沉三步的位置。没有伸手。\n\n雷斯特：ND 不会只丢一个人。明天他们会换手段。你一个人回去，等于把脖子送回去。\n\n陆沉：我没有要你们管我的脖子。\n\n安娜：那你刚才跟我跑楼梯的时候，是谁把你铐子化开的。\n\n△陆沉侧眼看她。安娜迎着看，不躲，但下巴微收——不像邀功，像把账摊开。\n\n陆沉：……我知道。所以我问完了。\n\n雷斯特：问完了？你连我们是谁、你母亲的档案在不在这里，都都没问。\n\n△陆沉手指在湿裤缝上摩半圈，停住。\n\n陆沉：我妈的档案，我自己查。你们救我，不等于我听你们的。★\n\n△大厅静了一拍。拱窗外雨声又远了一层。\n\n△雷斯特看着他，嘴角几乎没有动，眼神却收紧半寸——像第一次把「十七岁」和「难搞」叠在同一张脸上。\n\n雷斯特：行。那你今晚至少留在墙内。门从里面锁，不从外面。\n\n△陆沉点一下头。幅度极小。像接受一张临时床，不接受一张合同。\n\n安娜：我带你去侧廊。\n\n△她先一步朝侧廊走。陆沉跟上去，脚步比进厅时慢。\n\n【表演附注】\n- 节拍：压迫升级 + 转折 ｜ 场景功能：对峙 / 谈判 ｜ 价值：－（条款逼到面前）→ ＋（条件由他自己划）\n- 情绪线：雷斯特 从安置说辞（触发：ND 会换手段）→ 被顶回后改「墙内过夜」底线（触发：★句）；陆沉 从甩开管束 → ★钉死自主权；安娜 用救命账施压，被「问完了」挡回\n- 潜台词：★句是谢救命、拒收编；雷斯特「门从里面锁」是让步，也是监视边界的软化版；雷斯特说的「我们是谁」指底细与来历——陆沉只听过雨里那一句「翠羽社」，底子全空\n- 表演时机：★句前手指摩裤缝停住；说完后三人静一拍再接「行」；离场时脚步比进厅时慢，但不回头\n- 声音：陆沉★句中速、字清楚、不喊；雷斯特「行」短促；安娜带路时气声压低\n- 承接备注：「跑楼梯」指 ep05 安全出口楼梯，与本集同属那一夜，「刚才」口径成立；安娜那句「跟你跑楼梯」是她自己的记忆，语气是摊账不是邀功\n\n---\n\n### 7-3 翠羽社侧廊 夜 内\n\n人物：陆沉、安娜\n\n△侧廊比大厅窄。左边整面墙嵌着旧资料架，格子里塞满纸页、卷起的图纸、牛皮纸袋。灯只照亮靠前的两排，后面的格子全黑。\n\n△安娜走在前面半步，鞋跟敲在石板上，节奏没变。\n\n△陆沉的目光从一格滑到下一格。脚步顿了半拍，人没停。\n\n△最下层一叠旧纸后面探出半张纸。纸边发黄起毛，上面一行手写字。\n\n△他的手抬起来，离那张纸还有一拳，停住，收回。\n\n安娜：看什么呢。\n\n陆沉：……墙。\n\n安娜：旧档。别碰。\n\n△安娜转回去，继续走。\n\n△陆沉没停下，压着声音。\n\n陆沉：……陈玥。\n\n△陆沉跟上去。侧廊第二间是客房门，安娜推开门，让到一边。\n\n安娜：今晚你睡这儿。别的门，别开。\n\n△陆沉站在门口没进去。他转头看向左侧那面旧档墙。靠前的两排之外，全是黑的。攥着裤缝的手没松。◆\n\n【表演附注】\n- 节拍：收尾钩子 ｜ 场景功能：信息诱饵 ｜ 价值：＋（名字就在眼前）→ －（看得到、碰不得、不能说）\n- 情绪线：陆沉 从余怒未消（触发：雷斯特刚放完底线）→ 注意力被墙上某一格拽住（触发：纸角那行手写）→ 压住（触发：自己说出口的那两个字）→ 收手（触发：安娜说「旧档。别碰。」）；安娜 全程不停步，最后一句规矩不重不轻，像顺口提醒\n- 潜台词：陆沉伸手又收回＝他现在动手就等于承认「我要档案」，那就把主动权交出去了；他说出名字但没有回头＝他选择先记下、不说破\n- 表演时机：脚步只顿半拍就继续走；手抬到一拳距离就停；念名字时嘴几乎不动，声音压到只有自己听得见；最后在门口转头看那面墙，停两拍，不进门\n- 声音：鞋跟敲石板的节奏不变；纸页被风带得轻响一下；陆沉那两个字几乎不占空间\n- 衔接备注：残页上的字在画面里只做形状与材质，不承担可读性——「陈玥」二字由台词承载；纸面不设编号、日期等必须读懂的谜面，避免观众卡在小字上。空间关系：旧档墙在侧廊左侧，灯光只覆盖到第二排，客房是侧廊第二间，墙在客房之后继续往里延伸成黑——结尾他转头看的就是这面墙\n\n---\n\n## 剧情梗概（起承转合）\n\n- **起**：雨夜坡道，安娜把昏迷的陆沉拖上车；车一颠，他醒来第一句问的是「谁在追」。她答：ND 的追猎者，师傅留下断后。他们回翠羽社。\n- **承**：翠羽社大厅，雷斯特不要他道谢，只要他留下配合——ND 明天会换手段，安娜把救命账摊开，换他一个「问完了」。\n- **转**：陆沉不接安置、不接条件，钉死「我妈的档案，我自己查。你们救我，不等于我听你们的」（★）；雷斯特退一步，只要他墙内过夜，门从里面锁。\n- **合**：侧廊旧档墙上一角露着两个字——陈玥。他看见了，没碰，没说破，进门前只转头看了一眼左侧那面往里全黑的旧档墙（◆）。\n\n## 时长核算\n\n- **台词 363 字**（实点）：7-0 四句 53 字｜7-1 五句 93 字｜7-2 八句 178 字｜7-3 五句 39 字。落在 120s 档预算（240–400 字）内，不超密度。\n- **△ 动作节点 29 条、动作文本约 904 字**：7-0 五条约 150 字（转场刻意压到最简）｜7-1 八条约 307 字｜7-2 七条约 197 字｜7-3 九条约 250 字。\n- 按日漫短剧对白语速（4.5–5 字/秒，含句内停顿）台词约 73–81 秒；△ 表演时间约 30–36 秒；表演附注里的静默拍（7-2 三人静一拍、7-3 收尾停两拍）约 10–15 秒。\n- **结论：全集约 115–135 秒，落在 90–150 秒目标区间内，不增删场次。** 若成片偏短，只在 7-1 或 7-3 加一到两个动作节点，不加台词、不加场；若偏长，先砍 7-1 的第二段扫场描写，再砍 7-0 的下车动作，★ 与 ◆ 两处一个字不动。\n\n## 审稿记录\n\n1. **承接断链（最严重）**：原 7-1 直接以「站在门内两步远、清醒」开场，与 ep06 结尾（昏迷、被半拖半架退向坡道）之间没有过渡，观众会问「他怎么就站这儿了」。→ 改法：新增 7-0 转场场（复用 SCN-GARAGE，坡道→车内→到社），用「车一颠、头磕椅背」解决昏迷变清醒，用「坡道口一半露天、雨往下淌」解决「湿透」的来源。全场 △ 5 条约 150 字、台词 4 句，不新增场景资产、不重演车库战。同场另修一处硬伤：ep06 被蓝隼掀翻的是安娜自己那辆轿车，7-0 坡道顶停的是另一辆（预设撤离用车），两车不同框；地下车库这场实际只有 5 个 △ 节点，一镜到底也能拍完。\n2. **旧版台词残留**：「观察室出来的。门卫只晕了。」与 ep05 成片一致（观察室、门卫确有其事），但它复述的是两集前的旧事，回避了 ep06 唯一悬着的问题（帕斯卡断后、追猎者甩没甩掉），本集开场等于不承接上一集。→ 改法：改为汇报 ep06 结果「追猎的甩在车库了，我师傅断后，没跟上来。他半路自己醒的。」；ep05 已经交付的「不滥杀」由 ep05 自己负责，本集不重复。\n3. **「湿透」的成因不成立**：地下车库战之后，白衬衫「湿透贴在肩背」没有来源。→ 改法：不改「湿透」三字，而让 7-0 用一个可见动作给出成因（雨浇 + 汗 + 灰）；同时给 7-1 补两处余波（肩背磨破翻着灰白、额角一道擦伤），与 7-0「指腹上是灰和血」对上。\n4. **「观察室」在 ep07 造成空间错觉**：7-2 雷斯特原句「ND 不会只丢一个观察室」会唤起「又回 ND 了」的错觉，句子本身也绕。→ 改法：改为「ND 不会只丢一个人」，更直，也更贴本剧规则（保护必附带管控）。\n5. **「先把水控干」是生造词**：「控干」不成话。→ 改法：改为「先把身上的水擦干。客房在侧廊第二间，干净衣服和热水都备好了。」，安置条款的信息量不变。\n6. **7-2 末尾与 7-3 重复**：原草稿把「视线掠过旧页」放在 7-2 末尾，本集又要单独立 7-3，同一个发现写两遍会提前泄掉钩子。→ 改法：7-2 结尾只保留「她先一步朝侧廊走。陆沉跟上去，脚步比进厅时慢。」，把「看见旧页」整体移进 7-3，钩子全篇只出现一次。\n7. **★ 前的台阶太软**：「档案我自己查。」是口号式短句，与★句贴得太近，两句都像金句。→ 改法：改为「我妈的档案，我自己查。」——更口语、更具体，且与 7-3 旧档上的「陈玥」前后咬合（他先声明自己查，后看见它就贴在那面墙上，而他说不出口、碰不得）。★ 句本身逐字未动。\n8. **残页「可读文字」红线**：若残页上有关键信息而画面看不清，观众会困惑（「那两个字是什么」）。→ 改法：残页只做形状与材质（旧纸、泡过水的笔迹），名字由陆沉一句「……陈玥」以台词承载；纸面不设编号、日期等必须读懂的谜面，不给观众留下必须读懂的扣。安娜的「旧档。别碰。」同时把「保护必附带管控」这条规则钉进侧廊。\n\n## 修订记录\n\n- 2026-10-31：原为 ep06 草稿；6-1/6-2 完整；6-3/6-4 占位。\n- 2026-11-07：按用户指令迁为 ep07；改编号 7-1/7-2；删半成品占位堆砌；侧廊钩子待本集前确认再写。\n- 2026-11-07（定稿）：新增 7-0 转场场（承接 ep06 昏迷→清醒、湿透成因）；改写 7-1 安娜汇报句、修正 7-2 雷斯特首句与「水控干」；补写 7-3 侧廊钩子场（◆ 落在「看见、没碰、没说破」）；★ 前一句改为「我妈的档案，我自己查」；补时长核算与审稿记录 8 条。场景资产零新增。\n- 2026-11-11（口径统一 · 用户决定）：**陆沉服装**按 ep04 起成片正典与《人物视觉锚点表.md》统一为白衬衫口径——本集人物状态表「校服湿透混灰」→「白衬衫湿透混灰」、7-1「白蓝校服湿透贴在肩背」→「白衬衫湿透贴在肩背」、审稿记录第 3 条同步；**禁写蓝白运动校服**（ep05 早期误用已废弃）。湿透、磨破、灰白等状态描述全部保留，只换服装名称。台词、△ 动作、场次结构、★◆ 位置、时长结论（115–135 秒）均未动。本集无上屏文字，不受 ep06 屏字口径影响。\n"}];

(function () {
  const state = {
    episodes: EMBEDDED_EPISODES.slice(),
    epId: null,
    view: "full",
    roles: new Set(), // empty = all
    query: "",
  };

  function parseEpisode(md) {
    const scenes = [];
    const sceneTable = [];
    // scene table rows under ## 分场表
    const tableBlock = md.match(/##\s*分场表[\s\S]*?(?=\n##\s|\n---\n##\s|$)/);
    if (tableBlock) {
      const rows = tableBlock[0].split("\n").filter((l) => /^\|/.test(l) && !/^\|\s*-+/.test(l) && !/场次/.test(l));
      for (const r of rows) {
        const cells = r.split("|").slice(1, -1).map((c) => c.trim());
        if (cells.length >= 2) sceneTable.push(cells);
      }
    }

    // scenes: ### 6-1 ... or ### 6-1 ...
    const parts = md.split(/\n(?=###\s+\d+-\d+)/);
    for (const part of parts) {
      const hm = part.match(/^###\s+(\d+-\d+)\s+(.+)$/m);
      if (!hm) continue;
      const id = hm[1];
      const titleLine = hm[2].trim();
      const body = part.slice(part.indexOf("\n") + 1);
      const charsM = body.match(/^人物[：:]\s*(.+)$/m);
      const characters = charsM ? charsM[1].split(/[、,，]/).map((s) => s.trim()).filter(Boolean) : [];
      const blocks = [];
      const lines = body.split("\n");
      const skipWho = /^(id|title|status|duration_target|aspect|updated|premise|open|节拍|潜台词|情绪线|表演时机|声音|功能|场景功能|价值)$/;
      let i = 0;
      while (i < lines.length) {
        let line = lines[i];
        if (/^人物[：:]/.test(line) || /^---\s*$/.test(line) || /^##\s/.test(line)) { i++; continue; }
        if (/^【表演附注】/.test(line) || /^【表演附注/.test(line)) {
          const noteLines = [line.replace(/^【表演附注[^】]*】\s*/, "")];
          i++;
          while (i < lines.length && !/^###\s+\d+-\d+/.test(lines[i]) && !/^##\s/.test(lines[i])) {
            if (/^---\s*$/.test(lines[i])) break;
            noteLines.push(lines[i]);
            i++;
          }
          blocks.push({ type: "note", text: noteLines.join("\n").trim() });
          continue;
        }
        if (/^△/.test(line) || /^◆△/.test(line) || /^★△/.test(line)) {
          blocks.push({ type: "action", text: line.replace(/^[◆★]?△\s*/, "").trim() });
          i++; continue;
        }
        // placeholder dialogue under "- 角色：台词"
        const bulletDlg = line.match(/^-\s+([^：:\s]{1,12})[：:](.+)$/);
        if (bulletDlg && !skipWho.test(bulletDlg[1].trim())) {
          blocks.push({ type: "dialogue", who: bulletDlg[1].trim(), text: bulletDlg[2].trim() });
          i++; continue;
        }
        if (/^\*\*节拍意图\*\*/.test(line) || /^-\s/.test(line) || /^\*\*/.test(line)) {
          blocks.push({ type: "beat", text: line.trim() });
          i++; continue;
        }
        const dm = line.match(/^([^：:\s]{1,12})[：:](.+)$/);
        if (dm && !/^http/.test(dm[1]) && !skipWho.test(dm[1].trim())) {
          blocks.push({ type: "dialogue", who: dm[1].trim(), text: dm[2].trim() });
          i++; continue;
        }
        i++;
      }
      scenes.push({ id, heading: id + " " + titleLine, titleLine, characters, blocks });
    }
    return { scenes, sceneTable };
  }

  function allRoles(parsed) {
    const set = new Set();
    for (const s of parsed.scenes) {
      s.characters.forEach((c) => set.add(c));
      s.blocks.forEach((b) => { if (b.type === "dialogue") set.add(b.who); });
    }
    return [...set];
  }

  function markStars(text) {
    return text
      .replace(/★/g, '<span class="star">★</span>')
      .replace(/◆/g, '<span class="hook">◆</span>');
  }

  function highlight(text, q) {
    if (!q) return markStars(escapeHtml(text));
    const esc = escapeHtml(text);
    const re = new RegExp("(" + q.replace(/[.*+?^${}()|[\]\\]/g, "\\$&") + ")", "gi");
    return markStars(esc.replace(re, '<mark class="hl">$1</mark>'));
  }

  function escapeHtml(s) {
    return s.replace(/[&<>"']/g, (c) => ({ "&":"&amp;","<":"&lt;",">":"&gt;","\"":"&quot;","'":"&#39;" }[c]));
  }

  function current() {
    return state.episodes.find((e) => e.id === state.epId) || state.episodes[0];
  }

  function render() {

      main.innerHTML = '<p class="empty">没有 episodes。请先在 episodes/ 放 epXX.md 并运行 sync.py</p>';
      return;
    }
    const parsed = parseEpisode(ep.markdown);
    const meta = ep.meta || {};
    const roles = allRoles(parsed);

    // chips
    const chips = document.getElementById("roleChips");
    chips.innerHTML = roles.map((r) => {
      const on = state.roles.size === 0 || state.roles.has(r);
      return `<button type="button" class="chip ${state.roles.has(r) ? "on" : ""}" data-role="${escapeHtml(r)}">${escapeHtml(r)}</button>`;
    }).join("") + (roles.length ? `<button type="button" class="chip" data-role="__all">全部</button>` : "");

    // scene nav
    const nav = document.getElementById("sceneNav");
    nav.innerHTML = parsed.scenes.map((s) =>
      `<a href="#scene-${s.id}" data-sid="${s.id}">${escapeHtml(s.heading)}</a>`
    ).join("") || '<span class="sub">无场次</span>';

    const status = meta.status || "";
    let body = `<div class="meta-bar">
      <h2>${escapeHtml(meta.title || ep.id)}</h2>
      <span class="badge ${status.includes("草稿") ? "draft" : ""}">${escapeHtml(status || ep.id)}</span>
      <span class="badge">${escapeHtml(meta.duration_target || "")}</span>
      <span class="badge">${escapeHtml(meta.aspect || "16:9")}</span>
      <span class="sub">更新 ${escapeHtml(meta.updated || "")}</span>
    </div>`;

    if (state.view === "table") {
      if (!parsed.sceneTable.length) {
        body += '<p class="empty">本集没有解析到分场表</p>';
      } else {
        const head = parsed.sceneTable[0] ? null : null;
        // use first data rows; header was filtered — rebuild from known cols if needed
        body += `<table class="scenes"><thead><tr>
          <th>场次</th><th>场景</th><th>节拍</th><th>功能</th><th>价值</th><th>攻防</th><th>新知</th><th>因果</th>
        </tr></thead><tbody>`;
        for (const cells of parsed.sceneTable) {
          body += "<tr>" + cells.map((c) => `<td>${escapeHtml(c)}</td>`).join("") + "</tr>";
        }
        body += "</tbody></table>";
      }
      main.innerHTML = body;
      return;
    }

    if (!parsed.scenes.length) {
      body += '<p class="empty">未解析到场次（需要 ### 6-1 场景名… 格式）</p>';
      main.innerHTML = body;
      return;
    }

    const q = state.query.trim();
    for (const s of parsed.scenes) {
      const roleFilter = state.roles.size > 0;
      let sceneHas = !roleFilter;
      const blocksHtml = [];
      for (const b of s.blocks) {
        if (b.type === "action") {
          if (state.view === "dialogue") continue;
          blocksHtml.push(`<p class="action">${highlight(b.text, q)}</p>`);
        } else if (b.type === "dialogue") {
          const show = !roleFilter || state.roles.has(b.who);
          if (show) sceneHas = true;
          if (q && !b.text.includes(q) && !b.who.includes(q) && state.view === "dialogue") {
            // still show scene if other lines match — filter line
            if (!(b.text.includes(q) || b.who.includes(q))) {
              blocksHtml.push(`<p class="line hidden" data-who="${escapeHtml(b.who)}"><span class="who">${escapeHtml(b.who)}：</span>${highlight(b.text, q)}</p>`);
              continue;
            }
          }
          const hideLine = roleFilter && !state.roles.has(b.who);
          const hideSearch = q && !(b.text.includes(q) || b.who.includes(q));
          // In full view with search: dim non-matching dialogue but keep actions
          const cls = (hideLine || (q && hideSearch && state.view === "dialogue")) ? "line hidden" : "line";
          blocksHtml.push(`<p class="${cls}" data-who="${escapeHtml(b.who)}"><span class="who">${escapeHtml(b.who)}：</span>${highlight(b.text, q)}</p>`);
          if (!hideLine && (!q || !hideSearch || state.view === "full")) sceneHas = true;
        } else if (b.type === "note") {
          if (state.view === "dialogue") continue;
          blocksHtml.push(`<details class="note"><summary>表演附注</summary><pre style="white-space:pre-wrap;margin:0;font:inherit;color:inherit">${highlight(b.text, q)}</pre></details>`);
        } else if (b.type === "beat") {
          if (state.view === "dialogue") continue;
          blocksHtml.push(`<p class="action" style="opacity:.85">${highlight(b.text.replace(/^\*\*/,"").replace(/\*\*$/,""), q)}</p>`);
        }
      }
      if (q && state.view === "dialogue") {
        const any = s.blocks.some((b) => b.type === "dialogue" && (b.text.includes(q) || b.who.includes(q)) && (!roleFilter || state.roles.has(b.who)));
        sceneHas = any;
      } else if (roleFilter && state.view === "dialogue") {
        sceneHas = s.blocks.some((b) => b.type === "dialogue" && state.roles.has(b.who));
      } else if (roleFilter && state.view === "full") {
        sceneHas = s.blocks.some((b) => b.type === "dialogue" && state.roles.has(b.who)) || s.characters.some((c) => state.roles.has(c));
      }

      const charLine = s.characters.length ? `<p class="chars">人物：${escapeHtml(s.characters.join("、"))}</p>` : "";
      body += `<section class="scene ${sceneHas ? "" : "hidden"}" id="scene-${s.id}">
        <h3 class="scene-head">${escapeHtml(s.heading)}</h3>
        ${charLine}
        ${blocksHtml.join("\n")}
      </section>`;
    }
    main.innerHTML = body;
  }

  function init() {
    const sel = document.getElementById("epSelect");
    state.episodes.sort((a, b) => String(a.id).localeCompare(String(b.id), "zh"));
    sel.innerHTML = state.episodes.map((e) =>
      `<option value="${escapeHtml(e.id)}">${escapeHtml(e.id)} · ${escapeHtml((e.meta && e.meta.title) || e.id)}</option>`
    ).join("");
    state.epId = state.episodes[0] && state.episodes[0].id;
    sel.value = state.epId || "";
    sel.addEventListener("change", () => { state.epId = sel.value; state.roles.clear(); render(); });

    document.getElementById("viewMode").addEventListener("click", (ev) => {
      const btn = ev.target.closest("button[data-view]");
      if (!btn) return;
      state.view = btn.dataset.view;
      [...document.getElementById("viewMode").querySelectorAll("button")].forEach((b) => b.classList.toggle("active", b === btn));
      render();
    });

    document.getElementById("q").addEventListener("input", (ev) => {
      state.query = ev.target.value;
      render();
    });

    document.getElementById("roleChips").addEventListener("click", (ev) => {
      const btn = ev.target.closest("[data-role]");
      if (!btn) return;
      const r = btn.dataset.role;
      if (r === "__all") state.roles.clear();
      else {
        if (state.roles.has(r)) state.roles.delete(r);
        else state.roles.add(r);
      }
      render();
    });

    document.getElementById("sceneNav").addEventListener("click", (ev) => {
      const a = ev.target.closest("a[data-sid]");
      if (!a) return;
      ev.preventDefault();
      const el = document.getElementById("scene-" + a.dataset.sid);
      if (el) el.scrollIntoView({ behavior: "smooth", block: "start" });
    });

    render();
  }

  init();
})();
</script>
</body>
</html>
