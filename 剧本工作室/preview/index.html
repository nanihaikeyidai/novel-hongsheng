<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>《红绳》剧本预览</title>
<style>
  :root {
    --bg: #0f1218;
    --panel: #171b24;
    --panel2: #1e2430;
    --border: #2a3140;
    --text: #e8ecf4;
    --muted: #9aa3b5;
    --accent: #7aa2ff;
    --accent2: #5d8bff;
    --action: #a8b0c2;
    --name: #f0c674;
    --note: #8b93a7;
    --chip: #252b38;
    --danger: #e06c75;
    --ok: #98c379;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; background: var(--bg); color: var(--text);
    font-family: "PingFang SC", "Noto Sans SC", "Microsoft YaHei", system-ui, sans-serif;
    font-size: 15px; line-height: 1.65; }
  a { color: var(--accent); }
  .app { display: grid; grid-template-columns: 280px 1fr; height: 100vh; }
  aside { background: var(--panel); border-right: 1px solid var(--border);
    padding: 16px; overflow: auto; display: flex; flex-direction: column; gap: 14px; }
  main { overflow: auto; padding: 24px 28px 64px; }
  h1 { font-size: 16px; margin: 0 0 4px; font-weight: 600; }
  .sub { color: var(--muted); font-size: 12px; margin: 0; }
  label { display: block; font-size: 12px; color: var(--muted); margin-bottom: 6px; }
  select, input[type="search"], button {
    width: 100%; background: var(--panel2); color: var(--text);
    border: 1px solid var(--border); border-radius: 8px; padding: 8px 10px; font: inherit;
  }
  button { cursor: pointer; }
  button:hover, .chip:hover { border-color: var(--accent); }
  .row { display: flex; gap: 8px; flex-wrap: wrap; }
  .row button { width: auto; flex: 1; min-width: 72px; }
  .row button.active { background: var(--accent2); border-color: var(--accent2); color: #fff; }
  .chips { display: flex; flex-wrap: wrap; gap: 6px; }
  .chip { width: auto; padding: 4px 10px; border-radius: 999px; background: var(--chip);
    border: 1px solid var(--border); font-size: 12px; color: var(--muted); cursor: pointer; }
  .chip.on { color: #fff; border-color: var(--accent); background: #243049; }
  .scene-nav { display: flex; flex-direction: column; gap: 4px; }
  .scene-nav a { text-decoration: none; color: var(--muted); font-size: 13px;
    padding: 6px 8px; border-radius: 6px; }
  .scene-nav a:hover, .scene-nav a.active { background: var(--panel2); color: var(--text); }
  .meta-bar { display: flex; flex-wrap: wrap; gap: 10px; align-items: baseline;
    margin-bottom: 18px; padding-bottom: 12px; border-bottom: 1px solid var(--border); }
  .meta-bar h2 { margin: 0; font-size: 22px; font-weight: 650; }
  .badge { font-size: 12px; padding: 2px 8px; border-radius: 999px; background: var(--chip);
    color: var(--muted); border: 1px solid var(--border); }
  .badge.draft { color: var(--name); border-color: #5a4a28; }
  .scene { margin: 28px 0; scroll-margin-top: 24px; }
  .scene-head { font-size: 17px; font-weight: 650; margin: 0 0 8px;
    padding: 8px 12px; background: var(--panel); border-left: 3px solid var(--accent);
    border-radius: 0 8px 8px 0; }
  .chars { color: var(--muted); font-size: 13px; margin: 0 0 12px; }
  .action { color: var(--action); margin: 8px 0; }
  .action::before { content: "△ "; color: var(--accent); opacity: .7; }
  .line { margin: 10px 0 10px 4px; }
  .line .who { color: var(--name); font-weight: 600; margin-right: 6px; }
  .line.hidden, .scene.hidden, .note-block.hidden-by-filter { display: none; }
  details.note { margin: 14px 0 8px; background: var(--panel); border: 1px solid var(--border);
    border-radius: 8px; padding: 8px 12px; color: var(--note); font-size: 13px; }
  details.note summary { cursor: pointer; color: var(--muted); user-select: none; }
  details.note[open] summary { margin-bottom: 8px; }
  .star { color: #e5c07b; }
  .hook { color: #61afef; }
  table.scenes { width: 100%; border-collapse: collapse; font-size: 13px; }
  table.scenes th, table.scenes td { border: 1px solid var(--border); padding: 8px 10px;
    text-align: left; vertical-align: top; }
  table.scenes th { background: var(--panel); color: var(--muted); font-weight: 600; }
  table.scenes tr:hover td { background: #1a2030; }
  .empty { color: var(--muted); padding: 40px 0; text-align: center; }
  .hl { background: #3a3418; outline: 1px solid #6b5a20; border-radius: 2px; }

  /* ---------- 编辑模式 ---------- */
  .editbar { display: flex; gap: 8px; flex-wrap: wrap; align-items: center;
    margin-bottom: 14px; padding: 10px 12px; background: var(--panel2);
    border: 1px solid var(--border); border-radius: 10px; }
  .editbar button { width: auto; flex: 0 0 auto; padding: 7px 14px; }
  .editbar .hint { color: var(--muted); font-size: 12px; flex: 1 1 160px; min-width: 140px; }
  .editbar .dirty { color: var(--name); font-size: 12px; }
  body.editing .editbar { border-color: #3a4a6b; background: #1b2233; }
  body.editing .action, body.editing .line, body.editing .scene-head,
  body.editing .chars, body.editing details.note pre {
    outline: 1px dashed transparent; border-radius: 4px; transition: outline-color .12s; }
  body.editing .action:hover, body.editing .line:hover,
  body.editing details.note:hover pre { outline-color: #3d4a63; }
  body.editing .action:focus, body.editing .line:focus,
  body.editing details.note pre:focus {
    outline: 1px solid var(--accent); background: #1b2130; }
  body.editing .line .who { cursor: text; }
  body.editing .who-edit { display: inline-block; min-width: 3em; }
  .block-del { display: none; width: auto; margin-left: 8px; padding: 1px 7px;
    font-size: 11px; line-height: 1.5; color: var(--danger);
    border-color: #4a2b30; background: transparent; }
  body.editing .block-del { display: inline-block; }
  .block-del:hover { border-color: var(--danger); background: #2a1b1e; }
  .block-undel { display: none; width: auto; margin-left: 8px; padding: 1px 7px;
    font-size: 11px; line-height: 1.5; color: var(--ok);
    border-color: #2f5d3a; background: transparent; }
  body.editing .block-undel { display: inline-block; }
  .block-undel:hover { border-color: var(--ok); background: #1b2a1f; }
  .scene-add { display: none; gap: 6px; margin-top: 10px; }
  body.editing .scene-add { display: flex; }
  .scene-add button { width: auto; font-size: 12px; padding: 5px 10px; }

  /* ---------- 编辑：改动标记 / 插入行 / frontmatter ---------- */
  .blk { position: relative; }
  .blk.changed { background: rgba(240, 198, 116, .07); box-shadow: inset 3px 0 0 var(--name);
    border-radius: 0 6px 6px 0; }
  .blk.deleted { opacity: .4; }
  .blk.deleted .line, .blk.deleted .action, .blk.deleted .note { text-decoration: line-through; }
  .blk.ins { margin: 6px 0; }
  .ins-input { width: 100%; background: var(--panel2); color: var(--text);
    border: 1px dashed var(--accent); border-radius: 6px; padding: 6px 10px; font: inherit; }
  .ins-input:focus { outline: none; border-style: solid; border-color: var(--accent); }
  .front-edit { display: flex; gap: 12px; flex-wrap: wrap; align-items: flex-end;
    width: 100%; margin-top: 10px; padding-top: 10px; border-top: 1px dashed var(--border); }
  .front-edit > div { display: flex; flex-direction: column; }
  .front-edit label { margin-bottom: 4px; }
  .front-edit input, .front-edit select { width: auto; min-width: 150px; padding: 6px 8px; }
  .scene-head .sid { color: var(--accent); margin-right: 8px; opacity: .8; }
  .scene-head .head-title { border-bottom: 1px dashed transparent; }
  body.editing .scene-head .head-title { border-bottom-color: #3d4a63; }
  body.editing .scene-head .head-title:focus { outline: none; border-bottom-color: var(--accent); }
  .filter-hint { display: none; color: var(--name); font-size: 12px; margin: 6px 0 0; }
  body.editing .filter-hint { display: block; }
  .chip:disabled, button:disabled { cursor: not-allowed; opacity: .5; }

  /* ---------- 保存前预览面板 ---------- */
  .modal { position: fixed; inset: 0; z-index: 100; display: none;
    align-items: center; justify-content: center; padding: 24px;
    background: rgba(6, 8, 12, .72); }
  .modal.on { display: flex; }
  .modal-box { width: min(760px, 100%); max-height: 82vh; overflow: auto;
    background: var(--panel); border: 1px solid var(--border); border-radius: 12px;
    padding: 18px 20px; box-shadow: 0 12px 40px rgba(0,0,0,.5); }
  .modal-box h3 { margin: 0 0 4px; font-size: 16px; }
  .modal-box .note { margin: 0 0 12px; }
  .modal-list { display: flex; flex-direction: column; gap: 8px; margin-bottom: 14px; }
  .modal-item { border: 1px solid var(--border); border-radius: 8px; padding: 8px 10px;
    background: var(--panel2); font-size: 13px; }
  .modal-item .op { color: var(--accent); margin-right: 8px; }
  .modal-item .dline { color: var(--muted); font-size: 12px; }
  .modal-item pre { margin: 4px 0 0; white-space: pre-wrap; font: inherit; }
  .modal-item .from { color: #e8a0a5; }
  .modal-item .to { color: #a9d8b4; }
  .modal-actions { display: flex; gap: 8px; justify-content: flex-end; }
  .modal-actions button { width: auto; padding: 7px 16px; }
  .toast { position: fixed; right: 20px; bottom: 20px; z-index: 99;
    padding: 10px 16px; border-radius: 10px; font-size: 13px;
    background: #1e2430; border: 1px solid var(--border); color: var(--text);
    box-shadow: 0 8px 28px rgba(0,0,0,.45); opacity: 0;
    transform: translateY(8px); transition: all .18s; pointer-events: none; }
  .toast.on { opacity: 1; transform: translateY(0); }
  .toast.ok { border-color: #2f5d3a; color: #a9d8b4; }
  .toast.err { border-color: #5d2f33; color: #e8a0a5; }
  .offline-note { display: none; margin-bottom: 12px; padding: 10px 14px;
    font-size: 12.5px; color: #e0c98a; background: #2a2415;
    border: 1px solid #4a4025; border-radius: 8px; }
  body.editing .offline-note { display: block; }
  @media (max-width: 860px) {
    .app { grid-template-columns: 1fr; grid-template-rows: auto 1fr; }
    aside { border-right: none; border-bottom: 1px solid var(--border); max-height: 42vh; }
  }
</style>
</head>
<body>
<div class="app">
  <aside>
    <div>
      <h1>《红绳》剧本工作室</h1>
      <p class="sub">改 episodes/*.md → 跑 sync.py → 刷新本页</p>
    </div>
    <div>
      <label for="epSelect">选集</label>
      <select id="epSelect"></select>
    </div>
    <div class="editbar" id="editBar">
      <button type="button" id="btnEdit">进入编辑</button>
      <button type="button" id="btnSave" disabled>保存到文档</button>
      <button type="button" id="btnUndo" disabled>撤销本次改动</button>
      <button type="button" id="btnReload">重新载入</button>
      <span class="dirty" id="dirtyFlag"></span>
      <span class="hint" id="editHint">进入编辑后可改台词与动作，保存时写回 episodes/*.md</span>
    </div>
    <div>
      <label>视图</label>
      <div class="row" id="viewMode">
        <button type="button" data-view="full" class="active">全文</button>
        <button type="button" data-view="dialogue">仅台词</button>
        <button type="button" data-view="table">分场表</button>
      </div>
    </div>
    <div>
      <label for="q">搜索台词</label>
      <input id="q" type="search" placeholder="关键字…" autocomplete="off" />
      <p class="filter-hint">编辑时不可筛选/搜索</p>
    </div>
    <div>
      <label>角色过滤</label>
      <div class="chips" id="roleChips"></div>
    </div>
    <div>
      <label>场次</label>
      <nav class="scene-nav" id="sceneNav"></nav>
    </div>
  </aside>
  <main id="main">
    <p class="empty">加载中…</p>
  </main>
</div>

<!-- 保存前 diff 预览 -->
<div class="modal" id="diffModal">
  <div class="modal-box">
    <h3 id="diffTitle">保存前预览</h3>
    <p class="note sub" id="diffNote"></p>
    <div class="modal-list" id="diffList"></div>
    <div class="modal-actions">
      <button type="button" id="btnDiffCancel">取消</button>
      <button type="button" id="btnDiffOk">确认写回</button>
    </div>
  </div>
</div>
<script>

const EMBEDDED_EPISODES = [{"id": "ep06", "meta": {"id": "ep06", "title": "地下车库", "status": "定稿", "updated": "2026-11-07", "duration_target": "90-150s", "aspect": "16:9", "revision": "r2（定稿修订：空间冲突、到场公平线索、首场台词、△ 内镜头语言清理）＋r3（口径统一：陆沉服装改白衬衫正典；6-1d 两处屏字按「危险通话」先例处理）", "premise": "撤离路上被蓝隼截杀；安娜首次高光凝刃仍不敌；帕斯卡拦拳殿后", "open": "冷开场承接上一话——蓝隼已挡车前，安娜已说准备跳车；本集从跳车起"}, "markdown": "# 《红绳》第6集 · 地下车库\n\n```yaml\nid: ep06\ntitle: 地下车库\nstatus: 定稿\nduration_target: 90-150s\naspect: \"16:9\"\nupdated: 2026-11-07\nrevision: r2（定稿修订：空间冲突、到场公平线索、首场台词、△ 内镜头语言清理）＋r3（口径统一：陆沉服装改白衬衫正典；6-1d 两处屏字按「危险通话」先例处理）\npremise: 撤离路上被蓝隼截杀；安娜首次高光凝刃仍不敌；帕斯卡拦拳殿后\nopen: 冷开场承接上一话——蓝隼已挡车前，安娜已说准备跳车；本集从跳车起\n```\n\n> 格式：豆包同款（场次表头 + △ 客观动作 + 角色：台词 + 每场末【表演附注】）。画幅 16:9。日漫电影感短剧。\n> 用户锁定台词逐字保留（只规范标点）：不拆句、不合句、不调序、不换说话人。蓝隼人称一律用「他」（男）。\n> 主事件顺序（用户锁定）：跳车掀车 → 安娜凝刃 → 陆沉被踢晕 → 二阶几何斩断柱 → 帕斯卡拦拳。\n\n---\n\n## 剧本头\n\n《红绳》\n\n类型：多集短剧（都市校园悬疑 / 异能动作，单集武戏高光）\n\n风格：16:9 横屏高精度日漫电影感。地下车库冷白灯管 + 水泥灰 + 黑银哑光能量（无彩色粒子）；金属塌陷、碎玻璃、电弧冷调；唯一暖色是帕斯卡杯里的红酒。\n\n标签：异能动作 + 追猎截杀 + 师徒传承 + 自主权前奏\n\n人设：习惯独活的少年 × 不轻易出手的执行者 × 把截杀当热身的上司\n\n单集时长：约 110–135 秒 ｜ 剧作基调：短视频钩子驱动（高压武戏 + 集尾钩子）｜ 画幅：16:9\n\n---\n\n## 本集梗概\n\n- **目标（安娜）**：拖住蓝隼，把陆沉带离车库。\n- **阻力**：蓝隼近战碾压；陆沉冲动插手反成累赘。\n- **策略变化**：跳车甩障 → 飞刀牵制 → 鞋刃脱身 → 耳麦求援 → 二阶几何斩加压 → 仍被近身 → 帕斯卡拦拳接手。\n- **高潮**：★ 几何斩断柱（安娜二阶高光，但伤不到人）；◆ 帕斯卡令安娜带陆沉回社、自己留下。\n- **结果**：陆沉昏迷；安娜带人撤向坡道；帕斯卡 vs 蓝隼待续。\n- **伏笔（埋不收）**：蓝隼叫「小安娜」＝两人有旧账；蓝隼要「活的」＝ND 盯的是陆沉的血；帕斯卡胸前的银色羽毛胸针＝翠羽社。\n\n## 本集人物状态\n\n| | 开场 | 结尾 |\n|---|---|---|\n| 安娜 | 驾驶位/跳车执行态；深蓝长发；耳里一只蓝牙耳机（ep05 已有道具） | 满头大汗；二阶长刀散尽；接帕斯卡令，架陆沉退向坡道 |\n| 陆沉 | 17；白衬衫（袖口挽到手肘）＋深色长裤＋白运动鞋；被动红眼将启 | 被踹飞撞上侧方车位的翻车车身；昏迷；额角擦伤＋肩背磨破（滚落水泥地、被拖行所致，与 ep07 对齐）；由安娜架走 |\n| 蓝隼 | 26；电蓝短发、黑墨镜、战术服；拦车、轻浮 | 电拳被带偏砸进水泥柱；电弧被引走；兴趣转向帕斯卡 |\n| 帕斯卡 | （未入画） | 金发、考究外套、银色羽毛胸针、右手半杯红酒；扣腕带偏电拳；留下殿后 |\n\n---\n\n## 分场表\n\n| 场次 | 场景 时间 内外 | 节拍 | 场景功能 | 入场→离场 | 主攻防 | 观众新知道 | 观众此刻的问题 | 观众此刻的预测 | 与上一场 |\n|---|---|---|---|---|---|---|---|---|---|\n| 6-1a | 地下车库 夜 内 | 钩子 | 危机落地 | 还能撞过去 → 车废人落 | 跳车；车撞；蓝隼一拳掀车 | 蓝隼徒手能掀车 | 车里这两人是谁，往哪跑？ | 车撞上去总能把他撞飞 → 他连脚步都没动 | （接上集）所以跳 |\n| 6-1b | 地下车库 夜 内 | 压迫升级 | 对峙开战 | 安娜要护人独挡 → 陆沉一秒出局 | 飞刀令跑；陆沉插手；掐脖、踢飞 | 安娜会凝刃；红眼仍不够；ND 要活的 | 她说的「拖住」能拖多久？ | 陆沉红眼能吓退他 → 一脚踹昏 | 所以摆阵 |\n| 6-1c | 地下车库 夜 内 | 换招试探 | 试探/瓦解 | 被掐死局 → 喘上气，但援兵未到 | 鞋刃脱身；蓝隼封住陆沉方向；耳麦求援 | 两人有旧账；她在搬救兵 | 求援的人多久能到？ | 她开口求饶 → 她在向翠羽社报点 | 但是安娜没死 |\n| 6-1d | 地下车库 夜 内 | 假胜利 / 大压 | 能力高光 | 二阶像能翻盘 → 仍被瞬移贴脸 | 几何斩断柱；斜劈；电拳砸脸 | ★二阶凝刃的破坏力；屏字给出能力名与招式名（蓝隼是读了屏字才说出「二阶异能」） | 断柱这么强，能不能伤到他？ | 断柱＝能赢 → 他已经贴到脸前 | 所以开二阶 |\n| 6-1e | 地下车库 夜 内 | 转折收束 | 救援接手 | 要被电拳砸中 → 可撤、战场移交 | 帕斯卡扣腕带偏；令带回；自己留下 | ◆雷老板算到；ND 钓鱼；帕斯卡是谁 | 他一个人够不够？ | 没人会来 → 有人从坡道走进来 | 但是师傅到了 |\n\n**铺垫-回收账（本集）**：安娜从不轻易出手 → 本集首次凝刃高光；帕斯卡=师傅 → 关键时刻到位（到场线索提前埋在 6-1c 的耳麦求援）；陆沉「想帮」=冲动 → 被一脚踢昏，埋「独活不够」；ep05 耳机道具 → 本集复用为求援通路；翠羽社羽毛徽记 → 帕斯卡胸针的画面双通道。\n\n**本集亮点与钩子**：主亮点＝安娜二阶几何斩断柱仍打不中人；★＝几何斩断柱（全集 1 处）；◆＝帕斯卡「你带那小子回去，我陪他玩玩」（全集 1 处）。\n\n**预估**：1 大场景 5 段；说话 4 人（安娜、陆沉、蓝隼、帕斯卡）；动作节点 53 个；台词 16 句约 190 字（武戏集，台词让位给动作链）；实测时长约 110–135 秒，在 90–150 秒目标内。\n\n---\n\n## 第6集\n\n### 6-1a 地下车库 夜 内\n\n人物：安娜、陆沉、蓝隼\n\n△地下车库，冷白灯管一排排，地面黄黑停车线，远处排气扇嗡鸣。通道中央，一辆轿车引擎还在吼，车头对着坡道方向。\n\n△蓝隼站在车头灯的光里。电蓝短发，黑墨镜，石墨黑战术服，双手插兜。\n\n△驾驶座。安娜一把扣住陆沉的手腕。\n\n安娜：抓紧我。\n\n△车门弹开。两人滚落水泥地。陆沉肩背磕上地面，额角擦过水泥，闷响一声。安娜借滚势撑起半跪。\n\n△无人驾驶的轿车继续前冲，直撞蓝隼。\n\n△蓝隼没动。右拳抬起，拳峰贴上一层细密蓝白电弧。\n\n△拳落。\n\n△车头金属塌进一个拳印。\n\n△整车离地翻起来，横着砸进侧方车位，玻璃碎了一地。\n\n△烟尘散开。蓝隼抖了抖指节，墨镜反光里映出翻车残骸。\n\n【表演附注 6-1a】\n- 节拍：钩子 ｜ 场景功能：危机落地 ｜ 价值：还能用车撞 ＋ → 车废人落 －\n- 情绪线：安娜 说完就动、零犹豫（触发：车头被堵死）；陆沉 被动被拽、落地懵半拍（触发：肩膀磕地）；蓝隼 全程轻（触发：车撞过来时他没动）\n- 潜台词：「抓紧我」既是撤离指令也是保护指令；蓝隼一句话不说，比嘲讽更压人\n- 表演时机：跳车与车继续前冲压在同一拍；掀车拆「拳落→车头变形→整车离地→横砸进车位→碎玻璃」五个结果，蓝隼表情几乎不变\n- 声音：轮胎、衣料摩擦、金属塌陷、碎玻璃；引擎熄火后只剩排气扇的嗡鸣\n\n---\n\n### 6-1b 地下车库 夜 内\n\n人物：安娜、陆沉、蓝隼\n\n△安娜撑地站起，左脚前右脚后。双手抬到腰侧。\n\n△指缝间黑银色哑光能量一闪，凝成三柄短柄飞刀。刃面无彩光、无粒子，只剩冷金属质感。\n\n△她侧过半张脸，眼睛仍锁着蓝隼。\n\n安娜：快跑，我拖住他。\n\n△陆沉爬起半寸。虹膜骤然烧成赤红。白衬衫下摆被一股无形的气浪掀起来。他咬牙，拳握紧，肩线朝前。\n\n陆沉：我来帮你。\n\n△安娜头也不回。\n\n安娜：笨蛋。\n\n△话音未落。蓝隼刚才还在三米外，此刻已经贴到安娜面前。\n\n△他单手掐住安娜脖颈，整条手臂上举。安娜双脚离地，靴尖在空中蹬了两下。她两手死死扣住蓝隼前臂，指节发白；飞刀还夹在指间，一时甩不出角度。\n\n△陆沉一拳砸向蓝隼肋侧。\n\n△蓝隼头都没偏。他抬膝，一脚踹中陆沉胸口。\n\n△陆沉整个人飞出去，后背撞上侧方车位的翻车车身，滑坐下去。赤红从眼底褪成一线，头一歪，昏过去。\n\n△蓝隼的墨镜转向陆沉。镜面里那点红正在褪。\n\n蓝隼：赤瞳。……难怪上面要活的。\n\n【表演附注 6-1b】\n- 节拍：压迫升级 ｜ 场景功能：对峙开战 ｜ 价值：安娜要护人独挡 ＋ → 陆沉一秒出局 －\n- 情绪线：安娜 命令式甩开陆沉（触发：「快跑」）；陆沉 冲动插手（触发：看见她摆阵）；安娜「笨蛋」是怒不是嫌（触发：他把赤瞳亮出来）；蓝隼 从随意到认出目标（触发：镜面里那点红）\n- 潜台词：「我来帮你」= 十七岁的逞强；「笨蛋」= 你活着比你帮忙重要；「难怪上面要活的」= 陆沉在蓝隼眼里是货，不是人\n- 表演时机：飞刀黑银哑光，禁止彩色粒子；红眼在「我来帮你」前半拍点亮；掐喉与踢飞分成两条动作链，各写各的主行动者；赤瞳那句前留一拍，蓝隼先把墨镜转过去\n- 声音：安娜「笨蛋」短促怒吼；出拳破风；踹中胸口闷响；后背撞车身；蓝隼说赤瞳时语气平，不带情绪\n\n---\n\n### 6-1c 地下车库 夜 内\n\n人物：安娜、蓝隼、陆沉（昏迷不语）\n\n△安娜靴底一线黑银光一闪——鞋尖凝出短刃。\n\n△她借悬空拧腰，短刃朝蓝隼持喉那只手的腕侧划去。\n\n△蓝隼手腕一松，侧身让开刃锋，同时放手。\n\n△安娜落地，单膝触地，一手按住脖子，猛咳两声。额发湿贴，汗沿鬓角往下滚。\n\n△蓝隼退后半步，把手插回口袋。\n\n蓝隼：小安娜，多年不见，流系异能用的越来越熟练了啊。\n\n安娜：少废话。\n\n△她甩腕。三柄飞刀连环掷出，黑银轨迹贴地掠向蓝隼面门与肩窝。\n\n△蓝隼抬起左手，掌缘一带——叮、叮、叮。飞刀被拍飞，钉进坡道一侧一辆停着的车的车门，颤了两下，刃体开始溃散成灰银雾。\n\n蓝隼：投降吧，我不想欺负小孩，就这点程度是伤不到我的。\n\n△安娜没有看他。她抬手按住耳里的耳机，侧过脸，压着嗓子。\n\n安娜：目标在我这儿，速来。\n\n△耳机里只有一声很轻的电流接通响，没有回话。\n\n△安娜的视线扫向翻车残骸那边。蓝隼不紧不慢横移一步，正好挡在她和陆沉之间。\n\n【表演附注 6-1c】\n- 节拍：换招试探 ｜ 场景功能：试探/瓦解 ｜ 价值：被掐死局 － → 喘上气但援兵未到 ＋－\n- 情绪线：安娜 从窒息挣扎 → 落地咳血仍抬眼（触发：咳完第一口）；蓝隼 认出旧识后改用玩笑（触发：「小安娜」）→ 用身体封死她够到陆沉的路（触发：她看向残骸）\n- 潜台词：耳麦那句是向翠羽社报点，不是求饶；「小安娜」= 旧账 + 等级压制；「投降吧」= 他要的是活的，所以不急着杀她\n- 表演时机：鞋刃只闪一线黑银，不拉长特效；耳麦句说得又快又低，不给蓝隼反应时间；横移挡位那一步要慢，让观众看清楚；陆沉在残骸边昏迷入画余光即可，不抢戏\n- 声音：咳、鞋刃破风、耳麦接通的一声轻响、三记金属声、刀体溃散的细响；蓝隼语调轻浮上扬\n\n---\n\n### 6-1d 地下车库 夜 内\n\n人物：安娜、蓝隼\n\n△安娜抹了一把额汗，重新站直。她双手合拢又拉开——黑银色能量在掌心拉长、压薄，凝成一柄长刀。刀脊哑光，无彩晕。\n\n安娜：小看我可会吃亏的。\n\n△安娜的嘴闭着，不动。四个青绿描边黑体汉字「二阶凝刃」贴在她肩旁，字形与参考图 ref_二阶凝刃.png 完全一致；笔画边缘向上飘散着青绿幽灵火焰。\n\n△蓝隼的墨镜朝她耳边转了一下，又转回她脸上。他把插在口袋里的手抽出来。\n\n蓝隼：二阶异能，有意思，让我看看是什么招式。\n\n△安娜手腕一抖。刀尖极快划出一道直线，那道直线在半空折成一个三角形边框。\n\n△安娜的嘴闭着，不动。三个青绿描边黑体汉字「几何斩」贴在她持刀那一侧的肩旁，字形与参考图 ref_几何斩.png 完全一致；笔画边缘向上飘散着青绿幽灵火焰。\n\n△三角剑气脱离刀尖，带着黑银锋线朝蓝隼胸口飞去。\n\n△蓝隼身形往左一晃，人已错开半个车位。剑气擦着他衣角飞过——\n\n△剑气继续朝坡道方向切去。坡道一侧的水泥柱齐腰断开，上半截错位塌斜，钢筋外露，灰烟爆开。巨大断裂声砸满整个车库。★\n\n△安娜不等烟散，刀锋再起，朝右侧斜劈一道直线剑气。\n\n△蓝隼再次瞬移。再出现时，已站在安娜面前半臂距离。\n\n蓝隼：看来还是只有这点雕虫小技啊。\n\n△他右拳握紧。蓝白电弧从指节爬上手背，拳峰嗡地亮了一下。\n\n△拳朝安娜面门砸下。\n\n【表演附注 6-1d】\n- 节拍：假胜利 / 大压 ｜ 场景功能：能力高光 ｜ 价值：二阶像能翻盘 ＋＋ → 仍被瞬移贴脸 －－\n- 情绪线：安娜 咬牙开二阶（触发：听出「就这点程度」的轻视）；蓝隼 从好奇（触发：二阶）→ 兴趣消退（触发：断柱只断了柱）→ 收网（触发：听见耳麦那声接通响）\n- 潜台词：几何斩断柱 = 给观众看她能伤结构、伤不到他；墨镜朝耳边转那一下 = 他听懂了求援，所以不再等；电拳 = 处决预告\n- 表演时机：挥刀用「残影 + 折线成三角」表达，不写成慢动作咏唱；断柱声盖过一切；记忆锚点落在断柱的结果拍；电弧起势与出拳分两拍，别合成一个动作\n- 屏字处理（两处上屏文字 · 按 ep05「危险通话」先例）：①「二阶凝刃」——**必须等安娜说完「小看我可会吃亏的。」之后才出**，紧贴安娜肩旁，出屏字那一镜安娜**嘴闭、无声（ZERO speech）**；②「几何斩」——**在挥刀折出三角之后、剑气脱手之前出**，紧贴安娜持刀那一侧的肩旁，与任何台词都不重叠；③ 两处屏字**不得同时出现、不得挤在同一镜、不得居中漂浮、不得出现在蓝隼或任何别处**，只能贴在安娜身上；④ 字形一律绑定参考图 `ref_二阶凝刃.png` / `ref_几何斩.png`（纯黑底、青绿描边黑体中文、笔画边缘向上飘散青绿幽灵火焰），由资产生成阶段单独出纯文字参考图作独立 `<Picture N>` 喂进视频，让画面里的字严格等于参考图，防模型自造伪汉字；⑤ 屏字片段**单独生成 negativePrompt**，移除默认的禁文字项，改为「禁止出现参考图以外的任何其他文字／字符／伪汉字」，且 `timeline_data.segments[N].negativePrompt` 与 `timeline_data.batchWorkspaces.r2v.segments[N].negativePrompt` 必须完全一致；⑥ **英文提示词侧的用词红线**：屏字的英文特效描述沿用 P09 已通过的 v4 句式 `teal-blue wispy skill-name strokes`（或 teal-cyan wisps），**少写／不写 `ghost-fire`、`flame`、`fire` 堆叠**（P09 v5 已因 `demonic/devil/ghost-fire` 被 RH 敏感词拦下；中文侧仍按「向上飘散的青绿幽灵火焰」描述视觉，英文侧按本条写）\n- 声音：能量凝刀的短促嗡鸣；断柱轰响；电弧噼啪；蓝隼近身时呼吸几乎贴耳\n\n---\n\n### 6-1e 地下车库 夜 内\n\n人物：安娜、蓝隼、帕斯卡、陆沉（昏迷）\n\n△电拳落到安娜面前半尺——被一只手扣住腕骨，往外一带。\n\n△拳锋擦过安娜耳侧砸在水泥柱上。柱面炸开一片碎屑，电弧顺着钢筋窜进混凝土，暗了。\n\n△那只手扣着带电的手腕没松。电弧在两只手背之间噼啪乱窜，谁也没退。\n\n△金发男人从坡道方向走进灯里。考究外套，胸前一枚银色羽毛胸针。右手捏着半杯红酒，视线落在蓝隼脸上。\n\n帕斯卡：手挺快。\n\n△安娜横在身前的黑银长刀还没散。\n\n安娜：帕斯卡。\n\n△蓝隼的嘴角往上抬了一点。\n\n安娜：雷老板让你来的？\n\n帕斯卡：看来雷老板算到了啊，果然 ND 想利用那小子钓鱼。你带那小子回去，我陪他玩玩。◆\n\n△帕斯卡松开手。蓝隼收回拳，指节上的电弧一节节暗下去。\n\n△安娜横着的长刀散成灰银雾，落地。她点头，冲回翻车残骸边，把陆沉的一条手臂架上肩。\n\n△安娜半拖半架着陆沉退向坡道。\n\n△帕斯卡转回身，把酒杯举到唇边。蓝隼指节上的电弧重新亮起。\n\n【表演附注 6-1e】\n- 节拍：转折收束 ｜ 场景功能：救援接手 ｜ 价值：要被电拳砸中 － → 可撤、战场移交 ＋＋\n- 情绪线：安娜 从死线窒息 → 见师傅到位才敢卸力（触发：看见帕斯卡的手扣住那只腕）；帕斯卡 轻浮外壳、拦拳时手指极稳（触发：把电拳带偏）；蓝隼 兴趣从「小孩」转到「像样的对手」（触发：帕斯卡开口）\n- 潜台词：锁定句同时交三件事——雷老板有预判、ND 在钓鱼、你们撤我留下；红酒只作人物识别，不妨碍拦拳；「雷老板让你来的」是安娜在确认自己被安排\n- 表演时机：先给画外那只手扣腕，再让人脸入灯；拦拳靠技巧不靠新设定——电拳被带偏后顺着钢筋导进柱体，电弧自灭；安娜接令立刻执行带走，不站着谢师傅；陆沉全程无对白\n- 声音：电弧被压住的滋啦、碎石炸开；红酒杯随步伐轻晃；安娜拖人时的脚步与喘息；坡道口的风声\n\n---\n\n## 剧情梗概（起承转合）\n\n- **起**：安娜带陆沉跳车；轿车冲上去，蓝隼一拳把车掀翻，人被截停。\n- **承**：安娜凝刃令陆沉跑；陆沉红眼插手被一脚踹昏；鞋刃脱身；旧识调侃；飞刀被拍飞；她按住耳麦向翠羽社报点，耳机只回一声接通响。\n- **转**：二阶凝刃·几何斩断柱（★），仍被瞬移近身；蓝隼听见求援，改用杀招，电拳砸脸。\n- **合**：帕斯卡扣腕带偏电拳；令安娜带陆沉回社，自己留下陪蓝隼玩（◆）；安娜架着陆沉退向坡道。\n\n## 审稿记录\n\n> 本轮为定稿修订。上轮（2026-11-07）条目已逐条并入下列八条，不再单列。\n> 仍生效的锁定项：蓝隼人称一律用「他」；本集武戏口径（徒手掀车／瞬移近身／拳头带电）优先于旧「神经干扰丝」设定；凝刃为黑银色哑光、无彩色粒子；★ 落在几何斩断柱，◆ 落在帕斯卡「你带那小子回去，我陪他玩玩」；帕斯卡水系本集不展开。\n\n1. **前提不成立（最严重）：高潮靠外援，且帕斯卡到场毫无公平线索。** 证据：6-1e 全场；6-1a–6-1d 无任何铺垫。story-engine 前提测试「选择」项的失败信号就是\"靠巧合、新设定或外援收尾\"；帕斯卡同时还替观众口述了真相（「看来雷老板算到了啊」），正是 scene-engine 列为失败模式的\"角色口述真相，揭完只震惊\"。→ 改法：在 6-1c 加安娜按耳麦求援（「目标在我这儿，速来。」）并写\"耳机里只有一声很轻的电流接通响\"；6-1d 开头写\"蓝隼的墨镜朝她耳边转了一下\"——他听见了，所以放弃观望改用杀招，电拳因此有了新动机；6-1e 帕斯卡从坡道方向进来，到场来源明确为\"接到了求援\"而非巧合。耳麦沿用 ep05 已有道具，不新增资产。\n2. **因果断（空间硬冲突）：陆沉昏在柱下，而 6-1d 被斩断的正是那根柱。** 证据：6-1b「后背撞上水泥柱」／6-1d「后方一根水泥柱齐腰被切断」／6-1e「她撤步到水泥柱旁，架起昏迷的陆沉」。原稿里陆沉会被自己身旁断掉的柱子压住。→ 改法：陆沉改为被踹飞后撞上侧方车位的翻车车身（6-1b）；被斩断的柱明确在坡道一侧、也就是蓝隼身后（6-1d）；6-1e 改为\"冲回翻车残骸边\"接人。三处空间关系自洽。\n3. **讲不清：6-1a 全场无台词，前 15 秒没有目标与赌注。** 证据：6-1a 六个 △ 零对白。clarity.md 要求 90s 片前 15 秒交代四件事；原开场只让观众看见\"一辆车撞人然后被掀翻\"。→ 改法：加安娜一句「抓紧我。」放在跳车前（配\"扣住陆沉手腕\"的动作），交代她要带人走；再加 6-1b 蓝隼一句「赤瞳。……难怪上面要活的。」用画面（红眼熄灭）＋台词双通道交代赌注是\"ND 要活的\"，并提前埋下帕斯卡锁定句里的\"钓鱼\"。\n4. **讲不清：「雷老板」是全剧首次出现的机构称谓，帕斯卡本人也是首次露面。** 证据：6-1e 帕斯卡锁定句。clarity.md 要求人物关系在第一次互动就点明；原稿用\"△帕斯卡。\"这种动作行当名字卡，观众既不知道他是谁，也不知道\"雷老板\"是谁。→ 改法：由安娜先叫「帕斯卡。」完成命名，再问「雷老板让你来的？」一句话点明上下级关系，同时给帕斯卡的锁定句一个落点（他答\"雷老板算到了\"）；帕斯卡胸前的银色羽毛胸针与翠羽社徽记对应，作画面双通道。原句一字未动。\n5. **格式与可拍：△ 行里混进了镜头语言与作者解读。** 证据：6-1b「像画面被掐掉一帧」、6-1d「下一帧已站在……」、6-1e「电拳落到画面边线外半寸」、6-1c「像刚结束一次热身」。前三条是\"画面/下一帧/画面边线\"这类分镜语，第四条是编剧解读。→ 改法：分别改为\"蓝隼刚才还在三米外，此刻已经贴到安娜面前\"\"再出现时，已站在安娜面前半臂距离\"\"电拳落到安娜面前半尺\"；\"像刚结束一次热身\"从 △ 删除，语义移入表演附注。\n6. **台词假：蓝隼三句评语同强度、同句式，连续三拍重复\"我比你强\"。** 证据：6-1c「投降吧，我不想欺负小孩……」、6-1d「有意思，让我看看是什么招式」、6-1d「还是只有这点雕虫小技」。emotion-rhythm 的收益递减律下，连续同质评语第三次观众就麻了。台词锁定不能改，就用表演分层解决。→ 改法：在附注里把三句分成三档——6-1c 是俯身逗小孩的漫不经心，6-1d 第一句是第一次认真（手从口袋里抽出来），6-1d 第二句是兴趣消退、开始收网（紧接着电拳）。三句各自带出不同信息，不再是同一种压制。\n7. **没意思：6-1c 与 6-1d 连着两场都是\"安娜出手→被轻松化解\"，只有强度差没有性质差。** → 改法：把 6-1c 的落点改成\"援兵接通但人还没到\"的假胜利（她抬手按住耳机，蓝隼同时横移一步封死陆沉方向——希望刚起就被压住），让 6-1d 的 ★ 断柱真正承担\"放\"；策略阶梯（跳车→飞刀→鞋刃→二阶）不变，但每段离场的局面都变。\n8. **时长与可拍成本：** 按最终稿 53 个动作节点、16 句台词约 190 字测算，成片约 110–135 秒，落在 90–150 秒目标区间内，无需再砍。不加新场景、不加新人物、不换新道具（耳麦＝ep05 已有耳机；红酒杯改为全程握在手里，删掉原稿\"搁到最近车盖上\"的悬空动作——车已被掀翻，现场没有可用车盖）。凝刃全程黑银哑光，无彩色粒子。\n9. **两处上屏文字与项目「排除：可读细字屏幕」相抵（原写法不可执行）。** 证据：6-1d 原「△上屏文字：「二阶凝刃」」「△上屏文字：「几何斩」」两行只有字、没有可执行规格（谁身上、什么时候出、什么字形、参考图从哪来都没写），而《项目.md》「声音与视觉」栏排除「可读细字屏幕」，两条规则直接打架。→ 改法：按用户决定「参考危险通话处理方式」——屏字**保留**，处理方式照 ep05 P09 片段实跑通的先例逐条照搬：① **先出文字参考图**：由资产生成阶段先做纯文字参考图 `ref_二阶凝刃.png` / `ref_几何斩.png`（**纯黑底**；**青绿色（teal-cyan）描边**的**黑体中文**；笔画边缘带**向上飘散的青绿幽灵火焰/烟雾**；无衬线、无渐变、无描边阴影；纯文字居中横排），作独立 `<Picture N>` 喂进视频，让画面里的字严格等于参考图上的字——**防伪汉字**（P15 教训：单靠 `no readable text` 挡不住模型自造伪汉字，必须给参考图）；② **出现在谁旁边**：必须紧贴**对应人物**——「二阶凝刃」与「几何斩」都是安娜的，**贴在安娜身上**，绝不居中漂浮、绝不贴到蓝隼或空无一人处；③ **时序**：P09 铁律「说完再出屏字」——「二阶凝刃」在安娜说完「小看我可会吃亏的。」之后才出；「几何斩」在挥刀折出三角之后、剑气脱手之前出；两处不同时出现、不与任何台词重叠，出屏字那一镜 **ZERO speech**（嘴闭、无声）；④ **negativePrompt 侧**：屏字片段**单独生成** negativePrompt，把项目默认的「禁止字幕、禁止画面文字、禁止中文字符、禁止标题卡」**移除**，替换为「禁止出现参考图以外的任何其他文字／字符／伪汉字」；每个片段的 negativePrompt 单独生成且不得为空，`timeline_data.segments[N].negativePrompt` 与 `timeline_data.batchWorkspaces.r2v.segments[N].negativePrompt` 必须完全一致（《H3提示词生成前必读与标签门禁.md》）。⑤ **英文用词红线（新增，来自 `05-workflow/视频制作技巧_David.md` 的 P09 实测）**：中文侧仍写「向上飘散的青绿幽灵火焰」，但**英文提示词侧必须沿用 P09 已通过的 v4 句式** `teal-blue wispy skill-name strokes`（teal-cyan wisps），**不写 `ghost-fire`／`flame`／`fire` 堆叠**——P09 v5 已因 `demonic/devil/ghost-fire` 被 RH 敏感词拦下，v4 是已通过版本；同时避开 `rear` / `rear-cam` / `upside-down` / `backwards` 与全大写 `FORBIDDEN`，禁止项改写为 `Avoid: …` 句式。**相抵关系写进《项目.md》**：以保留屏字为准，「排除：可读细字屏幕」改为默认排除、**仅 ep06 6-1d 两处例外**。本条只改屏字的写法与落位，台词、动作链、场次结构、★◆ 位置、动作节点 53、台词 16 句约 190 字、实测 110–135 秒全部未动。\n\n## 修订记录\n\n- 2026-11-07：按用户锁定事件重写为地下车库战完整稿；回社线迁 ep07。\n- 2026-11-07：定稿修订——修空间硬冲突（陆沉落点／断柱方位／接人位置）；补帕斯卡到场的公平线索（6-1c 耳麦求援 + 6-1d 蓝隼听见）；补首场台词与 ND 赌注（6-1a「抓紧我」、6-1b 赤瞳句）；6-1e 补人物命名与「雷老板」关系点明；清除 △ 内镜头语言与作者解读；帕斯卡拦拳改为扣腕带偏、力量来自技巧；补剧本头、分场表新增观众预测/问题两列；实测时长 110–135 秒，仍在 90–150 秒目标内。用户锁定台词 10 句逐字保留、顺序与说话人未动；新增台词 6 句填在原句之间。\n- 2026-11-07（口径统一 · 用户决定）：① **陆沉服装**按 ep04 起成片正典与《人物视觉锚点表.md》统一为「白衬衫（袖口挽到手肘）＋深色长裤＋白运动鞋」——本集人物状态表与 6-1b「白衬衫下摆」两处改写；**禁写蓝白运动校服**（ep05 早期误用已废弃）；② **6-1d 两处上屏文字保留**，写法改按 ep05「危险通话」先例（先出纯文字参考图 `ref_二阶凝刃.png` / `ref_几何斩.png` 并绑定 `<Picture N>`、紧贴安娜身上、说完再出、出屏字那一镜 ZERO speech、屏字片段单独生成 negativePrompt 并移除默认禁文字项）；「二阶凝刃」落在安娜说完「小看我可会吃亏的。」之后，「几何斩」落在挥刀折出三角之后、剑气脱手之前。台词、△ 动作链、场次结构、★◆ 位置、动作节点 53、台词 16 句约 190 字、实测 110–135 秒全部未动。\n"}, {"id": "ep07", "meta": {"id": "ep07", "title": "陆沉回社", "status": "定稿", "updated": "2026-11-07", "duration_target": "90-150s", "aspect": "16:9", "premise": "进社不是保护，是「你终于没法独活」——自主权冲突；父/陈玥残页仅钩子", "open": "接 ep06 帕斯卡殿后；7-0 用坡道雨夜与车程把「昏迷」交代成「清醒、湿透、已知追猎者身份」；安娜带陆沉回翠羽社落地；不重拍车库战"}, "markdown": "# 《红绳》第7集 · 陆沉回社\n\n```yaml\nid: ep07\ntitle: 陆沉回社\nstatus: 定稿\nduration_target: 90-150s\naspect: \"16:9\"\nupdated: 2026-11-07\npremise: 进社不是保护，是「你终于没法独活」——自主权冲突；父/陈玥残页仅钩子\nopen: 接 ep06 帕斯卡殿后；7-0 用坡道雨夜与车程把「昏迷」交代成「清醒、湿透、已知追猎者身份」；安娜带陆沉回翠羽社落地；不重拍车库战\n```\n\n> 格式：豆包同款。画幅 16:9。高精度日漫电影感。\n> 场景：7-0 地下车库（复用 SCN-GARAGE）｜7-1、7-2 翠羽社大厅（SCN-CY-HALL）｜7-3 翠羽社侧廊（SCN-CY-CORRIDOR）。**本集未新增场景资产。**\n> 用户锁定台词逐字保留（只规范标点）：★「你们救我，不等于我听你们的。」◆＝侧廊旧档那一角（陆沉看见、没碰、没说破）。\n\n---\n\n## 剧本头（项目级，本集沿用）\n\n类型：多集短剧\n风格：冷调石构地下空间 + 雨夜湿冷；高精度日漫电影感；拱窗余光与主座纵深\n标签：都市校园悬疑 + 异能动作 + 机构管控 + 自主权冲突\n人设：习惯独活、要自己查清母亲死因的十七岁赤瞳少年 × 把「保护」做成「管控」的地下反抗组织\n单集时长：约 115–135 秒 ｜ 剧作基调：钩子驱动 ｜ 画幅：16:9\n\n---\n\n## 本集梗概\n\n- **目标**：陆沉在翠羽社落地后保住查案自主权。\n- **阻力**：雷斯特要他留下、配合；安娜用「救命」换听话空间。\n- **策略变化**：沉默跟走 → 明确拒绝被安排。\n- **高潮**：★「你们救我，不等于我听你们的。」\n- **结果**：人暂留社内，只谈成「墙内过夜」这一条；心不交权。\n- **下一钩子**：◆ 侧廊旧档墙上一角，露着「陈玥」两个字。\n\n## 本集人物状态\n\n| | 开场 | 结尾 |\n|---|---|---|\n| 陆沉 | 昏迷，被安娜半拖半架退向坡道；额角擦伤、肩背磨破、白衬衫湿透混灰 | 清醒；暂留墙内；自主权立住；已看见「陈玥」的名字，没说破 |\n| 雷斯特 | 等救人结果；准备安置条款；对「追猎者被甩掉」毫无反应 | 善意受阻；把底线退到「只留墙内过夜」；开始重新估量陆沉 |\n| 安娜 | 执行态余波；拖人上车；车程里只报情报不安慰 | 夹在社长与陆沉之间；用「旧档。别碰。」替社里封了一次口 |\n| 帕斯卡 | 留在车库与蓝隼对峙 | 本集不出画 |\n| 沈默 | 本集不出画 | — |\n\n---\n\n## 分场表\n\n| 场次 | 场景 时间 内外 | 节拍 | 场景功能 | 入场→离场 | 主攻防 | 观众新知道 | 与上一场 |\n|---|---|---|---|---|---|---|---|\n| 7-0 | 地下车库 夜 内 | 钩子 | 开场钩子 / 信息交底 | －（昏迷被拖着走）→ ＋（醒着开口问） | 目标：安娜把人和追猎者一起甩掉｜策略：拖到坡道、塞车、走雨夜｜反制：车一颠把人颠醒，醒的人开始问｜转折：陆沉醒来第一句问的是敌人，不是自己 | 追猎者是谁；帕斯卡留下断后；他们要回翠羽社 | （接 ep06）所以从坡道撤 |\n| 7-1 | 翠羽社大厅 夜 内 | 冲突确立 | 关系亮相 / 安置 | ＋（活着进社）→ －（条款压下来） | 目标：雷斯特要他留下、配合｜策略：先给换衣热水，再把「只要你活着站在这儿」当条件｜反制：陆沉不接安置也不道谢，只问一句「你们要什么」｜转折：雷斯特不答，把更大的条件留到下一拍 | 翠羽社的大厅与社长；追猎者没跟上来；安置条款开始 | 所以他进了门 |\n| 7-2 | 翠羽社大厅 夜 内 | 压迫升级 + 转折 | 对峙 / 谈判 | －（条款逼到面前）→ ＋（条件由他自己划） | 目标：雷斯特要「留下并配合」｜策略：用 ND 的威胁、用安娜的救命账夹击｜反制：陆沉先拒「管我的脖子」，再拒「问完了」，最后钉死★｜转折：雷斯特让出底线，改成只要他墙内过夜 | 保护必附带管控；档案可能就在这里；陆沉只肯自己查 | 所以条款砸下来 |\n| 7-3 | 翠羽社侧廊 夜 内 | 收尾钩子 | 信息诱饵 | ＋（名字就在眼前）→ －（看得到、碰不得、不能说） | 目标：安娜把人送进客房并立规矩｜策略：走快、用「旧档。别碰。」封口｜反制：陆沉看懂了、没碰、没说破，把名字记住了｜转折：纸角上那两个字是「陈玥」 | 陈玥的名字就在侧廊旧档上；翠羽社有档案、有规矩，也有知道的沉默 | 但是他走过旧档墙时，看见了一个名字 |\n\n**铺垫-回收（本集）**：ep04「我自己会查清楚」→ 本集对抗「我们替你查／你先留下」；ep05 安娜「今晚把你带活的回来」→ 本集雷斯特「今晚只要你还活着，站在这儿」；ep06 蓝隼与帕斯卡 → 本集只报结果，不给战果（留给后续集）。残页只埋不收。\n\n**观众预测与打破（本集）**：\n1. 预测「醒来会先问自己伤在哪／被审一遍」→ 打破：7-0 他第一句问的是「谁在追」，主动权抢在机构前面。\n2. 预测「★之后会被安排一切、逐步收编」→ 打破：他只点头接受「墙内过夜」一条，幅度极小，像接一张临时床不像接合同。\n3. 预测「看见母亲的档案会扑上去追问」→ 打破：7-3 他看见、没碰、没说破，进门前只转头看了一眼左侧那面旧档墙。\n\n**预估**：4 场（1 个既有场景复用 + 2 个既有场景）；说话 3 人（陆沉、安娜、雷斯特）；台词 363 字；△ 节点 29 条；估时 115–135 秒。\n\n---\n\n## 第7集\n\n### 7-0 地下车库 夜 内\n\n人物：陆沉、安娜\n\n△坡道口一半露天。雨从口子上泼下来，顺着坡道淌成薄薄一层水。\n\n△安娜半拖半架着陆沉退上来。雨浇在他肩上头发上，混着汗和灰。他垂着头，没醒。\n\n△她把他塞进坡道顶端那辆深色车的后座，带上车门。\n\n△车身一颠，陆沉的头磕在椅背上，猛地睁眼。他抬手抹脸，指腹上是灰和血。\n\n陆沉：……谁在追。\n\n安娜：ND 的追猎者，姓蓝隼。我师傅留下对付他，他追不到这儿。\n\n陆沉：……我们这是去哪儿。\n\n安娜：翠羽社。\n\n△车停。安娜拉开后座门。陆沉撑着门下车，肩膀晃了一下，站住。\n\n【表演附注】\n- 节拍：钩子 ｜ 场景功能：开场钩子 / 信息交底 ｜ 价值：－（昏迷被拖着走）→ ＋（醒着开口问）\n- 情绪线：陆沉 昏迷（触发：被拖过坡道）→ 被颠醒（触发：头磕在椅背上）→ 先问「谁在追」（触发：清醒后的第一反应是先搞清楚敌人）→ 再问「去哪儿」（触发：确认自己被带去了别人选的地方）；安娜 全程执行态，不安慰、不解释多余\n- 潜台词：陆沉问「谁在追」＝十七岁的第一反应是敌人，不是自己；安娜说「他追不到这儿」＝安抚被压缩成一条情报\n- 表演时机：醒来只给「睁眼 + 抬手抹脸」，不要喊疼；下车时肩膀晃一下，随后自己站住——身体差，但站得住\n- 声音：坡道雨声压过车库回声；车门两声闷响；车轮碾过积水；陆沉声音哑而短\n- 衔接备注：本场是纯转场，△ 动作共 5 条约 150 字，不演车库战、不出帕斯卡与蓝隼的画面；擦伤来自 ep06 摔在水泥地上那次翻滚，本集不新增新伤。**车辆口径（三辆车不得互相误认）**：① ep06 被蓝隼掀翻、陆沉滑坐在旁的轿车，在**左侧侧方车位**；② ep06 6-1c 飞刀钉住的那辆停着的车，在**坡道一侧**；③ 本场坡道顶端这辆**深色车**，是撤离用车，与前两辆不是同一辆。取景避开车库深处残骸，三车不同框。\n\n---\n\n### 7-1 翠羽社大厅 夜 内\n\n人物：陆沉、安娜、雷斯特\n\n△门外雨声猛地被石墙切短。铁门在身后合上，水声只剩鞋底与地面的黏响。\n\n△陆沉站在门内两步远。白衬衫湿透贴在肩背，磨破一块，翻着灰白。额角一道擦伤，血和雨混在一起。碎发贴额，水珠沿下颌线往下掉。他没有擦。眼睛先扫拱窗、主座、墙上翠羽徽记，最后才落回前方。\n\n△安娜侧身半步，让开他与主座之间的直线。袖口还潮着，呼吸已经压平。\n\n△纵深尽头，雷斯特坐在主座。银灰发，黑衣，胸前羽毛胸针在拱窗余光里亮了一下。指节在桌沿点一下，停住。\n\n雷斯特：回来了。\n\n△陆沉不接话。肩线绷着，像还在听门外有没有第二组脚步。\n\n安娜：追猎的甩在车库了，我师傅断后，没跟上来。他半路自己醒的。\n\n雷斯特：先把身上的水擦干。客房在侧廊第二间，干净衣服和热水都备好了。\n\n△陆沉抬眼看他。停半拍。\n\n陆沉：你们要什么。\n\n△雷斯特没立刻答。他看了一眼安娜，又看回陆沉，肩线仍松着，像在交代一件已经想清楚的事。\n\n雷斯特：今晚——只要你还活着，站在这儿。\n\n△陆沉喉结动一下。鞋底的水在石板砖上洇开一小圈。\n\n【表演附注】\n- 节拍：冲突确立 ｜ 场景功能：关系亮相 / 安置 ｜ 价值：＋（活着进社）→ －（条款压下来）\n- 情绪线：陆沉 戒备扫场（触发：进门落位）→ 最短质问（触发：换衣热水被当成安排）；雷斯特 全程淡定，唯开场指节敲桌沿一下是唯一泄出来的紧（触发：听说追猎者被甩掉，他一点都不意外）；安娜 执行收束，只汇报不表态\n- 潜台词：陆沉问「要什么」＝不承认这是无条件的保护；雷斯特「只要你活着」＝把更大的条件留到下一拍；安娜那句「他半路自己醒的」＝把陆沉交到社长手上，同时提醒社长这孩子醒着\n- 表演时机：陆沉进门先扫空间再看人；水珠掉下颌时不擦；问句前半拍停顿；雷斯特答话前先看安娜一眼\n- 声音：雷斯特低、稳、不演讲；陆沉声短、偏哑；大厅有一点石壁回声；安娜汇报语速比平时快半拍\n- 衔接备注：「湿透」的成因由 7-0 坡道雨夜给出（雨浇 + 汗 + 灰），本场不再解释；「观察室／门卫」是 ep05 已经演过的旧事，本场改为汇报 ep06 结果\n\n---\n\n### 7-2 翠羽社大厅 夜 内\n\n人物：陆沉、雷斯特、安娜\n\n△雷斯特起身，绕过主座一角，停在距离陆沉三步的位置。没有伸手。\n\n雷斯特：ND 不会只丢一个人。明天他们会换手段。你一个人回去，等于把脖子送回去。\n\n陆沉：我没有要你们管我的脖子。\n\n安娜：那你刚才跟我跑楼梯的时候，是谁把你铐子化开的。\n\n△陆沉侧眼看她。安娜迎着看，不躲，但下巴微收——不像邀功，像把账摊开。\n\n陆沉：……我知道。所以我问完了。\n\n雷斯特：问完了？你连我们是谁、你母亲的档案在不在这里，都都没问。\n\n△陆沉手指在湿裤缝上摩半圈，停住。\n\n陆沉：我妈的档案，我自己查。你们救我，不等于我听你们的。★\n\n△大厅静了一拍。拱窗外雨声又远了一层。\n\n△雷斯特看着他，嘴角几乎没有动，眼神却收紧半寸——像第一次把「十七岁」和「难搞」叠在同一张脸上。\n\n雷斯特：行。那你今晚至少留在墙内。门从里面锁，不从外面。\n\n△陆沉点一下头。幅度极小。像接受一张临时床，不接受一张合同。\n\n安娜：我带你去侧廊。\n\n△她先一步朝侧廊走。陆沉跟上去，脚步比进厅时慢。\n\n【表演附注】\n- 节拍：压迫升级 + 转折 ｜ 场景功能：对峙 / 谈判 ｜ 价值：－（条款逼到面前）→ ＋（条件由他自己划）\n- 情绪线：雷斯特 从安置说辞（触发：ND 会换手段）→ 被顶回后改「墙内过夜」底线（触发：★句）；陆沉 从甩开管束 → ★钉死自主权；安娜 用救命账施压，被「问完了」挡回\n- 潜台词：★句是谢救命、拒收编；雷斯特「门从里面锁」是让步，也是监视边界的软化版；雷斯特说的「我们是谁」指底细与来历——陆沉只听过雨里那一句「翠羽社」，底子全空\n- 表演时机：★句前手指摩裤缝停住；说完后三人静一拍再接「行」；离场时脚步比进厅时慢，但不回头\n- 声音：陆沉★句中速、字清楚、不喊；雷斯特「行」短促；安娜带路时气声压低\n- 承接备注：「跑楼梯」指 ep05 安全出口楼梯，与本集同属那一夜，「刚才」口径成立；安娜那句「跟你跑楼梯」是她自己的记忆，语气是摊账不是邀功\n\n---\n\n### 7-3 翠羽社侧廊 夜 内\n\n人物：陆沉、安娜\n\n△侧廊比大厅窄。左边整面墙嵌着旧资料架，格子里塞满纸页、卷起的图纸、牛皮纸袋。灯只照亮靠前的两排，后面的格子全黑。\n\n△安娜走在前面半步，鞋跟敲在石板上，节奏没变。\n\n△陆沉的目光从一格滑到下一格。脚步顿了半拍，人没停。\n\n△最下层一叠旧纸后面探出半张纸。纸边发黄起毛，上面一行手写字。\n\n△他的手抬起来，离那张纸还有一拳，停住，收回。\n\n安娜：看什么呢。\n\n陆沉：……墙。\n\n安娜：旧档。别碰。\n\n△安娜转回去，继续走。\n\n△陆沉没停下，压着声音。\n\n陆沉：……陈玥。\n\n△陆沉跟上去。侧廊第二间是客房门，安娜推开门，让到一边。\n\n安娜：今晚你睡这儿。别的门，别开。\n\n△陆沉站在门口没进去。他转头看向左侧那面旧档墙。靠前的两排之外，全是黑的。攥着裤缝的手没松。◆\n\n【表演附注】\n- 节拍：收尾钩子 ｜ 场景功能：信息诱饵 ｜ 价值：＋（名字就在眼前）→ －（看得到、碰不得、不能说）\n- 情绪线：陆沉 从余怒未消（触发：雷斯特刚放完底线）→ 注意力被墙上某一格拽住（触发：纸角那行手写）→ 压住（触发：自己说出口的那两个字）→ 收手（触发：安娜说「旧档。别碰。」）；安娜 全程不停步，最后一句规矩不重不轻，像顺口提醒\n- 潜台词：陆沉伸手又收回＝他现在动手就等于承认「我要档案」，那就把主动权交出去了；他说出名字但没有回头＝他选择先记下、不说破\n- 表演时机：脚步只顿半拍就继续走；手抬到一拳距离就停；念名字时嘴几乎不动，声音压到只有自己听得见；最后在门口转头看那面墙，停两拍，不进门\n- 声音：鞋跟敲石板的节奏不变；纸页被风带得轻响一下；陆沉那两个字几乎不占空间\n- 衔接备注：残页上的字在画面里只做形状与材质，不承担可读性——「陈玥」二字由台词承载；纸面不设编号、日期等必须读懂的谜面，避免观众卡在小字上。空间关系：旧档墙在侧廊左侧，灯光只覆盖到第二排，客房是侧廊第二间，墙在客房之后继续往里延伸成黑——结尾他转头看的就是这面墙\n\n---\n\n## 剧情梗概（起承转合）\n\n- **起**：雨夜坡道，安娜把昏迷的陆沉拖上车；车一颠，他醒来第一句问的是「谁在追」。她答：ND 的追猎者，师傅留下断后。他们回翠羽社。\n- **承**：翠羽社大厅，雷斯特不要他道谢，只要他留下配合——ND 明天会换手段，安娜把救命账摊开，换他一个「问完了」。\n- **转**：陆沉不接安置、不接条件，钉死「我妈的档案，我自己查。你们救我，不等于我听你们的」（★）；雷斯特退一步，只要他墙内过夜，门从里面锁。\n- **合**：侧廊旧档墙上一角露着两个字——陈玥。他看见了，没碰，没说破，进门前只转头看了一眼左侧那面往里全黑的旧档墙（◆）。\n\n## 时长核算\n\n- **台词 363 字**（实点）：7-0 四句 53 字｜7-1 五句 93 字｜7-2 八句 178 字｜7-3 五句 39 字。落在 120s 档预算（240–400 字）内，不超密度。\n- **△ 动作节点 29 条、动作文本约 904 字**：7-0 五条约 150 字（转场刻意压到最简）｜7-1 八条约 307 字｜7-2 七条约 197 字｜7-3 九条约 250 字。\n- 按日漫短剧对白语速（4.5–5 字/秒，含句内停顿）台词约 73–81 秒；△ 表演时间约 30–36 秒；表演附注里的静默拍（7-2 三人静一拍、7-3 收尾停两拍）约 10–15 秒。\n- **结论：全集约 115–135 秒，落在 90–150 秒目标区间内，不增删场次。** 若成片偏短，只在 7-1 或 7-3 加一到两个动作节点，不加台词、不加场；若偏长，先砍 7-1 的第二段扫场描写，再砍 7-0 的下车动作，★ 与 ◆ 两处一个字不动。\n\n## 审稿记录\n\n1. **承接断链（最严重）**：原 7-1 直接以「站在门内两步远、清醒」开场，与 ep06 结尾（昏迷、被半拖半架退向坡道）之间没有过渡，观众会问「他怎么就站这儿了」。→ 改法：新增 7-0 转场场（复用 SCN-GARAGE，坡道→车内→到社），用「车一颠、头磕椅背」解决昏迷变清醒，用「坡道口一半露天、雨往下淌」解决「湿透」的来源。全场 △ 5 条约 150 字、台词 4 句，不新增场景资产、不重演车库战。同场另修一处硬伤：ep06 被蓝隼掀翻的是安娜自己那辆轿车，7-0 坡道顶停的是另一辆（预设撤离用车），两车不同框；地下车库这场实际只有 5 个 △ 节点，一镜到底也能拍完。\n2. **旧版台词残留**：「观察室出来的。门卫只晕了。」与 ep05 成片一致（观察室、门卫确有其事），但它复述的是两集前的旧事，回避了 ep06 唯一悬着的问题（帕斯卡断后、追猎者甩没甩掉），本集开场等于不承接上一集。→ 改法：改为汇报 ep06 结果「追猎的甩在车库了，我师傅断后，没跟上来。他半路自己醒的。」；ep05 已经交付的「不滥杀」由 ep05 自己负责，本集不重复。\n3. **「湿透」的成因不成立**：地下车库战之后，白衬衫「湿透贴在肩背」没有来源。→ 改法：不改「湿透」三字，而让 7-0 用一个可见动作给出成因（雨浇 + 汗 + 灰）；同时给 7-1 补两处余波（肩背磨破翻着灰白、额角一道擦伤），与 7-0「指腹上是灰和血」对上。\n4. **「观察室」在 ep07 造成空间错觉**：7-2 雷斯特原句「ND 不会只丢一个观察室」会唤起「又回 ND 了」的错觉，句子本身也绕。→ 改法：改为「ND 不会只丢一个人」，更直，也更贴本剧规则（保护必附带管控）。\n5. **「先把水控干」是生造词**：「控干」不成话。   // 行区间是否互相重叠 —— 口径与 core.apply_ops 一致：
  //   1) replace/delete/replace_line 三类占用的区间互不相交
  //   2) insert_after 的锚点不能落在别的 op 区间 [s, e) 里
  function checkOverlap(ops) {
    const problems = [];
    const ranges = [];
    (ops || []).forEach(function (op, i) {
      if (op.op === "replace_block" || op.op === "delete_block") {
        ranges.push({ i: i, s: op.lineStart, e: op.lineEnd, op: op });
      } else if (op.op === "replace_line") {
        ranges.push({ i: i, s: op.line, e: op.line, op: op });
      }
    });
    for (let a = 0; a < ranges.length; a++) {
      for (let b = a + 1; b < ranges.length; b++) {
        const x = ranges[a], y = ranges[b];
        if (x.s <= y.e && y.s <= x.e) {
          problems.push(
            "第 " + (x.s + 1) + "–" + (x.e + 1) + " 行与第 " + (y.s + 1) + "–" + (y.e + 1) + " 行的改动重叠"
          );
        }
      }
    }
    (ops || []).forEach(function (op) {
      if (op.op !== "insert_after") return;
      ranges.forEach(function (r) {
        if (r.s <= op.line && op.line < r.e) {
          problems.push("插入位置（第 " + (op.line + 1) + " 行后）落在第 " +
            (r.s + 1) + "–" + (r.e + 1) + " 行的改动区间里");
        }
      });
    });
    return problems;
  }

  // 本次主动删除的行数与附注段数（供服务端完整性闸门放行）。
  // 口径 = core.deleted_allowance：统计所有 op 圈住的行里，
  // 有多少行是台词行 / 动作行 / 附注段头；台词与动作共用一个 "lines" 额度。
  function countDeleted(ops, lines) {
    const src = lines || [];
    const get = function (i) { return String(src[i] == null ? "" : src[i]).replace(/\r$/, ""); };
    const touched = new Set();
    (ops || []).forEach(function (op) {
      if (op.op === "replace_block" || op.op === "delete_block") {
        for (let i = op.lineStart; i <= op.lineEnd; i++) touched.add(i);
      } else if (op.op === "replace_line") {
        touched.add(op.line);
      }
    });
    let dlg = 0, act = 0, note = 0;
    touched.forEach(function (i) {
      const t = get(i);
      if (RE_DIALOGUE.test(t)) dlg += 1;
      if (RE_ACTION.test(t)) act += 1;
      if (RE_NOTE.test(t)) note += 1;
    });
    return { lines: Math.max(dlg, act), notes: note };
  }

  /*__OPS_PURE_END__*/

  /* =====================================================================
   * 通用小工具
   * ===================================================================== */

  function escapeHtml(s) {
    return String(s == null ? "" : s).replace(/[&<>"']/g, function (c) {
      return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c];
    });
  }

  function markStars(text) {
    return String(text)
      .replace(/★/g, '<span class="star">★</span>')
      .replace(/◆/g, '<span class="hook">◆</span>');
  }

  function highlight(text, q) {
    if (!q) return markStars(escapeHtml(text));
    const esc = escapeHtml(text);
    const re = new RegExp("(" + q.replace(/[.*+?^${}()|[\]\\]/g, "\\$&") + ")", "gi");
    return markStars(esc.replace(re, '<mark class="hl">$1</mark>'));
  }

  // contenteditable → 单行纯文本（换行折成空格）
  function readField(el) {
    if (!el) return "";
    let t = (el.innerText || el.textContent || "").replace(/ /g, " ").replace(/\r/g, "");
    return t.split("\n")
      .map(function (s) { return s.replace(/^[ \t]+/, "").replace(/[ \t]+$/, ""); })
      .filter(function (s) { return s !== ""; })
      .join(" ");
  }

  // contenteditable → 附注正文（多行，每行 "- " 开头）
  function readNoteBody(el) {
    if (!el) return "";
    let t = (el.innerText || el.textContent || "").replace(/ /g, " ").replace(/\r/g, "");
    return t.split("\n")
      .map(function (s) { return s.replace(/^[ \t]+/, "").replace(/[ \t]+$/, ""); })
      .filter(function (s) { return s !== ""; })
      .map(function (s) {
        if (s.indexOf("- ") === 0) return s;
        if (s.charAt(0) === "-") return "- " + s.slice(1).replace(/^ +/, "");
        return "- " + s;
      })
      .join("\n");
  }

  function toast(msg, kind) {
    let el = document.getElementById("toast");
    if (!el) {
      el = document.createElement("div");
      el.id = "toast";
      el.className = "toast";
      document.body.appendChild(el);
    }
    el.textContent = msg;
    el.className = "toast on " + (kind || "");
    clearTimeout(el._t);
    el._t = setTimeout(function () { el.className = "toast " + (kind || ""); }, 2600);
  }

  function current() {
    return state.episodes.find(function (e) { return e.id === state.epId; }) || state.episodes[0];
  }

  function findScene(sid) {
    const scenes = (state.parsed && state.parsed.scenes) || [];
    for (let i = 0; i < scenes.length; i++) if (scenes[i].id === sid) return scenes[i];
    return null;
  }

  // 页面是否具备访问本地服务的条件。
  // file:// 打开时 Chrome 会把 "/api/xxx" 解析成 "file:///D:/api/xxx" 并抛
  // "URL scheme file is not supported"——失败发生在协议层，必须提前判断，
  // 否则会误以为服务端已连上而一直停在「加载中…」。
  function canReachServer() {
    return location.protocol === "http:" || location.protocol === "https:";
  }

  function allRoles(parsed) {
    const set = new Set();
    (parsed.scenes || []).forEach(function (s) {
      (s.characters || []).forEach(function (c) { set.add(c); });
      (s.blocks || []).forEach(function (b) { if (b.type === "dialogue" && b.who) set.add(b.who); });
    });
    return Array.from(set);
  }

  // 原文第 N 行（服务端 lines 里可能带 \r，统一去掉）
  function rawLine(i) {
    const src = (state.parsed && state.parsed.lines) || [];
    return String(src[i] == null ? "" : src[i]).replace(/\r$/, "");
  }

  /* =====================================================================
   * 离线只读解析（file:// 且没有本地服务时用）
   * —— 只负责把 markdown 显示出来，不参与任何写入逻辑。
   * ===================================================================== */

  function parseLocal(md) {
    const text = String(md || "");
    const lines = text.split(/\r?\n/).map(function (l) { return l.replace(/\r$/, ""); });

    const meta = {};
    let inYaml = false;
    for (let i = 0; i < lines.length; i++) {
      const l = lines[i];
      if (/^```\s*ya?ml/.test(l)) { inYaml = true; continue; }
      if (inYaml && /^```/.test(l)) { inYaml = false; continue; }
      if (inYaml) {
        const m = l.match(/^([A-Za-z_][\w-]*)\s*:\s*(.*)$/);
        if (m) meta[m[1]] = m[2].replace(/^["']/, "").replace(/["']$/, "").trim();
      }
    }

    const sceneTable = [];
    const tb = text.match(/##\s*分场表[\s\S]*?(?=\n##\s|\n---\n##\s|$)/);
    if (tb) {
      tb[0].split("\n").forEach(function (l) {
        if (!/^\|/.test(l) || /^\|\s*-+/.test(l)) return;
        const cells = l.split("|").slice(1, -1).map(function (c) { return c.trim(); });
        if (cells.length >= 2 && cells[0] !== "场次") sceneTable.push(cells);
      });
    }

    const heads = [];
    for (let i = 0; i < lines.length; i++) {
      const m = lines[i].match(/^###\s+(\d+-\d+[a-z]?)\s*(.*)$/);
      if (m) heads.push({ line: i, id: m[1], titleLine: m[2].trim() });
    }
    const scenes = [];
    for (let h = 0; h < heads.length; h++) {
      const hLine = heads[h].line;
      let end = h + 1 < heads.length ? heads[h + 1].line : lines.length;
      for (let k = hLine + 1; k < end; k++) {
        if (/^##\s/.test(lines[k])) { end = k; break; }
      }
      while (end > hLine + 1 && (!lines[end - 1].trim() || /^-{3,}\s*$/.test(lines[end - 1]))) end -= 1;

      const charsM = lines.slice(hLine + 1, end).join("\n").match(/^人物[：:]\s*(.+)$/m);
      const characters = charsM
        ? charsM[1].split(/[、,，]/).map(function (s) { return s.trim(); }).filter(Boolean)
        : [];
      const blocks = [];
      let i = hLine + 1;
      while (i < end) {
        const line = lines[i];
        if (!line.trim()) { i++; continue; }
        if (/^-{3,}\s*$/.test(line) || /^#{1,6}\s/.test(line)) { i++; continue; }
        if (/^人物[：:]\s*(.+)$/.test(line)) { i++; continue; }
        if (NOTE_HEAD_RE.test(line)) {
          const header = line;
          let j = i + 1;
          while (j < end && lines[j].trimStart().startsWith("-")) j += 1;
          const body = lines.slice(i + 1, j);
          blocks.push({
            type: "note", who: "", text: body.join("\n"), prefix: "", header: header,
            lineStart: i, lineEnd: (j - 1) > i ? (j - 1) : i,
          });
          i = j;
          continue;
        }
        const act = line.match(/^([◆★]?)△[^\S　]?(.*)$/);
        if (act) {
          blocks.push({
            type: "action", who: "", text: act[2].trim(), prefix: act[1] + "△",
            lineStart: i, lineEnd: i,
          });
          i++; continue;
        }
        const dlg = line.match(/^([^：:\s　]{1,12})([：:])(.*)$/);
        if (dlg) {
          blocks.push({
            type: "dialogue", who: dlg[1].trim(), prefix: dlg[2], text: dlg[3].trim(),
            lineStart: i, lineEnd: i,
          });
          i++; continue;
        }
        const bullet = line.match(/^-\s+([^：:\s]{1,12})([：:])(.*)$/);
        if (bullet) {
          blocks.push({
            type: "dialogue", who: bullet[1].trim(), prefix: bullet[2], text: bullet[3].trim(),
            lineStart: i, lineEnd: i,
          });
          i++; continue;
        }
        blocks.push({ type: "beat", who: "", text: line.trim(), prefix: "", lineStart: i, lineEnd: i });
        i++;
      }
      scenes.push({
        id: heads[h].id,
        heading: (heads[h].id + " " + heads[h].titleLine).trim(),
        titleLine: heads[h].titleLine,
        characters: characters,
        blocks: blocks,
        lineStart: hLine,
        lineEnd: Math.max(hLine, end - 1),
      });
    }
    return { meta: meta, scenes: scenes, sceneTable: sceneTable, lines: lines };
  }

  /* =====================================================================
   * 渲染
   * ===================================================================== */

  // 找到 frontmatter 里某个键所在的行号（找不到返回 -1）
  function findFrontLine(key) {
    const lines = (state.parsed && state.parsed.lines) || [];
    let inYaml = false;
    for (let i = 0; i < lines.length; i++) {
      const l = String(lines[i]).replace(/\r$/, "");
      if (/^```\s*ya?ml/.test(l)) { inYaml = true; continue; }
      if (inYaml && /^```/.test(l)) { inYaml = false; continue; }
      if (inYaml && l.indexOf(key + ":") === 0) return i;
    }
    return -1;
  }

  // frontmatter 某字段当前值（含尚未保存的改动）
  function frontValue(key) {
    const rec = state.front.get(key);
    if (rec) return rec.value;
    const idx = findFrontLine(key);
    if (idx >= 0) {
      const m = rawLine(idx).match(/^[^:]*:\s*([\s\S]*)$/);
      if (m) return m[1].replace(/^["']/, "").replace(/["']$/, "");
    }
    const meta = (state.parsed && state.parsed.meta) || {};
    return meta[key] || "";
  }

  function frontEditHtml() {
    const st = frontValue("status");
    const opts = STATUS_OPTIONS.slice();
    if (st && opts.indexOf(st) < 0) opts.unshift(st);
    return '<div class="front-edit">' +
      '<div><label for="fStatus">状态</label><select id="fStatus" data-front="status">' +
        opts.map(function (o) {
          return '<option value="' + escapeHtml(o) + '"' + (o === st ? " selected" : "") + ">" + escapeHtml(o) + "</option>";
        }).join("") +
      "</select></div>" +
      '<div><label for="fTitle">标题</label><input id="fTitle" type="text" data-front="title" value="' +
        escapeHtml(frontValue("title")) + '" /></div>' +
      '<div><label for="fUpdated">更新日期</label><input id="fUpdated" type="text" data-front="updated" value="' +
        escapeHtml(frontValue("updated")) + '" /></div>' +
      "</div>";
  }

  function delBtn(key, deleted, label) {
    if (deleted) {
      return '<button type="button" class="block-undel" data-undel="' + escapeHtml(key) + '">恢复</button>';
    }
    return '<button type="button" class="block-del" data-del="' + escapeHtml(key) + '">' + (label || "删除") + "</button>";
  }

  // 附注块：拆成「标题行 + 正文行」。
  // 服务端 note.text 只含正文（每行 "- " 开头），标题行在 block.header / 原文首行里。
  function noteParts(b) {
    const arr = String(b.text == null ? "" : b.text).split("\n");
    let title = b.header || "";
    if (!title && arr.length && NOTE_HEAD_RE.test(arr[0])) {
      title = arr.shift();          // 兼容调用方把标题行也塞进 text 的情况
    }
    if (!title) {
      const raw = rawLine(b.lineStart);
      if (NOTE_HEAD_RE.test(raw)) title = raw;
    }
    return { title: title, body: arr.join("\n") };
  }

  // 编辑态渲染一个块
  function editableBlockHtml(b) {
    const key = blockKey(b);
    const rec = state.blocks.get(key);
    const deleted = !!(rec && rec.deleted);
    const modified = !!(rec && rec.modified);
    const who = rec && rec.who != null ? rec.who : (b.who || "");
    const text = rec && rec.text != null ? rec.text : (b.text || "");
    const cls = "blk" + (modified ? " changed" : "") + (deleted ? " deleted" : "");
    const attrs = 'data-bk="' + escapeHtml(key) + '" data-ls="' + b.lineStart + '" data-le="' + b.lineEnd +
      '" data-type="' + escapeHtml(b.type) + '"';
    // 已标记删除的块不再可编辑，避免「删除 + 改写」同时存在
    const ed = deleted ? "false" : "true";

    if (b.type === "dialogue") {
      return '<div class="' + cls + '" ' + attrs + '>' +
        '<p class="line">' +
          '<span class="who who-edit" contenteditable="' + ed + '" data-part="who">' + escapeHtml(who) + "</span>" +
          '<span class="sep">' + escapeHtml(b.prefix || "：") + "</span>" +
          '<span class="txt-edit" contenteditable="' + ed + '" data-part="text">' + escapeHtml(text) + "</span>" +
          delBtn(key, deleted) +
        "</p></div>";
    }
    if (b.type === "note") {
      const np = noteParts(b);
      const body = rec && rec.text != null ? rec.text : np.body;
      return '<div class="' + cls + '" ' + attrs + '>' +
        '<details class="note" open><summary>' + escapeHtml(np.title || "表演附注") + "</summary>" +
          '<pre contenteditable="' + ed + '" data-part="text" style="white-space:pre-wrap;margin:0;font:inherit;color:inherit">' +
            escapeHtml(body) +
          "</pre>" +
        "</details>" + delBtn(key, deleted, "删除本段") + "</div>";
    }
    if (b.type === "beat") {
      // 节拍提示行只允许删除，不开放内容编辑，避免改坏结构
      return '<div class="' + cls + '" ' + attrs + '>' +
        '<p class="action" style="opacity:.85">' + escapeHtml(b.text) + "</p>" +
        delBtn(key, deleted) + "</div>";
    }
    return '<div class="' + cls + '" ' + attrs + '>' +
      '<p class="action" contenteditable="' + ed + '" data-part="text">' + escapeHtml(text) + "</p>" +
      delBtn(key, deleted) + "</div>";
  }

  function insertRowHtml(rec) {
    const ph = rec.kind === "action" ? "△（新动作）" : "角色：（新台词）";
    return '<div class="blk ins' + (rec.text ? " changed" : "") + '" data-ins="' + escapeHtml(rec.id) + '">' +
      '<input class="ins-input" type="text" data-part="text" placeholder="' + escapeHtml(ph) +
      '" value="' + escapeHtml(rec.text || "") + '" /></div>';
  }

  function sceneAddHtml(s) {
    return '<div class="scene-add">' +
      '<button type="button" data-add="action" data-sid="' + escapeHtml(s.id) + '">＋动作</button>' +
      '<button type="button" data-add="dialogue" data-sid="' + escapeHtml(s.id) + '">＋台词</button>' +
      "</div>";
  }

  // 插入锚点：场景里最后一个非附注块的末行。
  // 这样新行落在「动作/台词」区末尾、附注块之前，不会插进附注块内部。
  function insertAnchorFor(s) {
    const blocks = s.blocks || [];
    for (let i = blocks.length - 1; i >= 0; i--) {
      if (blocks[i].type !== "note") return blocks[i].lineEnd;
    }
    return s.lineStart;
  }

  function render() {
    const main = document.getElementById("main");
    const ep = current();
    if (!ep) {
      main.innerHTML = '<p class="empty">没有 episodes。请先在 episodes/ 放 epXX.md 并运行 sync.py</p>';
      return;
    }
    const parsed = state.parsed;
    if (!parsed) {
      main.innerHTML = '<p class="empty">加载中…</p>';
      return;
    }
    const meta = parsed.meta || ep.meta || {};

    // 角色 chips（编辑态禁用：筛选会隐藏内容，导致改不到被隐藏的块）
    const roles = allRoles(parsed);
    const chips = document.getElementById("roleChips");
    chips.innerHTML = roles.map(function (r) {
      return '<button type="button" class="chip ' + (state.roles.has(r) ? "on" : "") +
        '" data-role="' + escapeHtml(r) + '"' + (state.editing ? " disabled" : "") + ">" + escapeHtml(r) + "</button>";
    }).join("") + (roles.length
      ? '<button type="button" class="chip" data-role="__all"' + (state.editing ? " disabled" : "") + ">全部</button>"
      : "");

    // 场次导航
    const nav = document.getElementById("sceneNav");
    nav.innerHTML = (parsed.scenes || []).map(function (s) {
      return '<a href="#scene-' + escapeHtml(s.id) + '" data-sid="' + escapeHtml(s.id) + '">' + escapeHtml(s.heading) + "</a>";
    }).join("") || '<span class="sub">无场次</span>';

    // 元信息条
    const status = meta.status || "";
    let body = '<div class="meta-bar">' +
      "<h2>" + escapeHtml(meta.title || ep.id) + "</h2>" +
      '<span class="badge ' + (status.indexOf("草稿") >= 0 ? "draft" : "") + '">' + escapeHtml(status || ep.id) + "</span>" +
      '<span class="badge">' + escapeHtml(meta.duration_target || "") + "</span>" +
      '<span class="badge">' + escapeHtml(meta.aspect || "16:9") + "</span>" +
      '<span class="sub">更新 ' + escapeHtml(meta.updated || "") + "</span>" +
      (state.editing ? frontEditHtml() : "") +
      "</div>";

    if (state.view === "table" && !state.editing) {
      if (!parsed.sceneTable || !parsed.sceneTable.length) {
        body += '<p class="empty">本集没有解析到分场表</p>';
      } else {
        body += '<table class="scenes"><thead><tr>' +
          "<th>场次</th><th>场景</th><th>节拍</th><th>功能</th><th>价值</th><th>攻防</th><th>新知</th><th>因果</th>" +
          "</tr></thead><tbody>";
        parsed.sceneTable.forEach(function (cells) {
          body += "<tr>" + cells.map(function (c) { return "<td>" + escapeHtml(c) + "</td>"; }).join("") + "</tr>";
        });
        body += "</tbody></table>";
      }
      main.innerHTML = body;
      return;
    }

    if (!parsed.scenes || !parsed.scenes.length) {
      body += '<p class="empty">未解析到场次（需要 ### 6-1 场景名… 格式）</p>';
      main.innerHTML = body;
      return;
    }

    const showNotes = state.view !== "dialogue" || state.editing;
    const q = state.query.trim();

    parsed.scenes.forEach(function (s) {
      const roleFilter = state.roles.size > 0;
      let sceneHas = !roleFilter;
      const blocksHtml = [];
      const blocks = s.blocks || [];
      // 最后一个非附注块的位置 —— 插入按钮与新行插在这里（附注之前）
      let lastContentIdx = -1;
      for (let i = 0; i < blocks.length; i++) {
        if (blocks[i].type !== "note") lastContentIdx = i;
      }
      let anchorPlaced = false;

      blocks.forEach(function (b, bi) {
        if (state.editing) {
          blocksHtml.push(editableBlockHtml(b));
          if (bi === lastContentIdx) {
            anchorPlaced = true;
            (state.inserts.get(s.id) || []).forEach(function (rec) { blocksHtml.push(insertRowHtml(rec)); });
            blocksHtml.push(sceneAddHtml(s));
          }
          if (b.type === "dialogue") sceneHas = true;
          return;
        }
        if (b.type === "action") {
          if (state.view === "dialogue") return;
          blocksHtml.push('<p class="action">' + highlight(b.text, q) + "</p>");
        } else if (b.type === "dialogue") {
          const show = !roleFilter || state.roles.has(b.who);
          if (show) sceneHas = true;
          const hideSearch = q && !(b.text.indexOf(q) >= 0 || (b.who || "").indexOf(q) >= 0);
          const hideLine = roleFilter && !state.roles.has(b.who);
          const cls = (hideLine || (q && hideSearch && state.view === "dialogue")) ? "line hidden" : "line";
          blocksHtml.push('<p class="' + cls + '" data-who="' + escapeHtml(b.who || "") + '">' +
            '<span class="who">' + escapeHtml(b.who || "") + escapeHtml(b.prefix || "：") + "</span>" +
            highlight(b.text, q) + "</p>");
          if (!hideLine && (!q || !hideSearch || state.view === "full")) sceneHas = true;
        } else if (b.type === "note") {
          if (!showNotes) return;
          blocksHtml.push('<details class="note"><summary>表演附注</summary><pre style="white-space:pre-wrap;margin:0;font:inherit;color:inherit">' +
            highlight(b.text, q) + "</pre></details>");
        } else if (b.type === "beat") {
          if (state.view === "dialogue") return;
          blocksHtml.push('<p class="action" style="opacity:.85">' +
            highlight(String(b.text).replace(/^\*\*/, "").replace(/\*\*$/, ""), q) + "</p>");
        }
      });

      if (state.editing && !anchorPlaced) {
        (state.inserts.get(s.id) || []).forEach(function (rec) { blocksHtml.push(insertRowHtml(rec)); });
        blocksHtml.push(sceneAddHtml(s));
      }

      if (q && state.view === "dialogue") {
        sceneHas = blocks.some(function (b) {
          return b.type === "dialogue" && (b.text.indexOf(q) >= 0 || (b.who || "").indexOf(q) >= 0) &&
            (!roleFilter || state.roles.has(b.who));
        });
      } else if (roleFilter && state.view === "dialogue") {
        sceneHas = blocks.some(function (b) { return b.type === "dialogue" && state.roles.has(b.who); });
      } else if (roleFilter && state.view === "full") {
        sceneHas = blocks.some(function (b) { return b.type === "dialogue" && state.roles.has(b.who); }) ||
          (s.characters || []).some(function (c) { return state.roles.has(c); });
      }

      const charLine = (s.characters && s.characters.length)
        ? '<p class="chars">人物：' + escapeHtml(s.characters.join("、")) + "</p>" : "";
      // 场次标题可编辑：场次号固定（与附注标题【表演附注 6-1a】对应），只让标题部分可改
      const headRec = state.heads.get(s.id);
      const headTitle = headRec ? headRec.title : (s.titleLine || "");
      body += '<section class="scene ' + (sceneHas ? "" : "hidden") + '" id="scene-' + escapeHtml(s.id) + '">' +
        (state.editing
          ? '<h3 class="scene-head"><span class="sid">' + escapeHtml(s.id) + "</span>" +
            '<span class="head-title" contenteditable="true" data-head="' + escapeHtml(s.id) +
            '" title="点击可改场次标题">' + escapeHtml(headTitle) + "</span></h3>"
          : '<h3 class="scene-head">' + escapeHtml(s.heading) + "</h3>") +
        charLine + blocksHtml.join("\n") + "</section>";
    });

    main.innerHTML = body;
  }

  /* =====================================================================
   * 编辑动作 → 编辑模型
   * ===================================================================== */

  function findBlockByKey(key) {
    const scenes = (state.parsed && state.parsed.scenes) || [];
    for (let i = 0; i < scenes.length; i++) {
      const blocks = scenes[i].blocks || [];
      for (let j = 0; j < blocks.length; j++) {
        if (blockKey(blocks[j]) === key) return blocks[j];
      }
    }
    return null;
  }

  function ensureBlockRec(b) {
    const key = blockKey(b);
    let rec = state.blocks.get(key);
    if (!rec) {
      const origText = b.type === "note" ? noteParts(b).body : (b.text != null ? b.text : "");
      rec = {
        ls: b.lineStart, le: b.lineEnd, type: b.type,
        who: b.who != null ? b.who : "",
        text: b.type === "note" ? origText : (b.text != null ? b.text : ""),
        origWho: b.who != null ? b.who : "",
        origText: origText,
        modified: false, deleted: false,
      };
      state.blocks.set(key, rec);
    }
    return rec;
  }

  function blockChanged(blkEl) {
    const key = blkEl.dataset.bk;
    const b = findBlockByKey(key);
    if (!b) return;
    const rec = ensureBlockRec(b);
    if (rec.deleted) return;
    if (b.type === "dialogue") {
      rec.who = readField(blkEl.querySelector('[data-part="who"]')).replace(/[：:]\s*$/, "").trim();
      rec.text = readField(blkEl.querySelector('[data-part="text"]'));
      rec.modified = rec.who !== rec.origWho || rec.text !== rec.origText;
    } else if (b.type === "note") {
      rec.text = readNoteBody(blkEl.querySelector('[data-part="text"]'));
      rec.modified = rec.text !== rec.origText;
    } else {
      rec.text = readField(blkEl.querySelector('[data-part="text"]'));
      rec.modified = rec.text !== rec.origText;
    }
    blkEl.classList.toggle("changed", rec.modified);
    markDirty(true);
  }

  function findInsertRec(id) {
    let hit = null;
    state.inserts.forEach(function (list) {
      list.forEach(function (rec) { if (rec.id === id) hit = rec; });
    });
    return hit;
  }

  function insertChanged(inputEl) {
    const holder = inputEl.closest("[data-ins]");
    if (!holder) return;
    const rec = findInsertRec(holder.dataset.ins);
    if (!rec) return;
    let text = inputEl.value.replace(/\r/g, "");
    if (rec.kind === "action") {
      text = text.trim();
      if (text && !/^[◆★]?△/.test(text)) text = "△" + text;
    }
    rec.text = text;
    holder.classList.toggle("changed", !!text);
    markDirty(true);
  }

  function frontChanged(el) {
    const key = el.dataset.front;
    const idx = findFrontLine(key);
    if (idx < 0) {
      toast("frontmatter 里找不到字段：" + key + "，无法改写", "err");
      return;
    }
    const orig = rawLine(idx);
    const m = orig.match(/^(\s*[^:]+:\s*)([\s\S]*)$/);
    const prefix = m ? m[1] : key + ": ";
    const oldVal = m ? m[2] : "";
    let val = el.value;
    // 保留原有的引号风格
    if (/^["']/.test(oldVal) && /^["']/.test(val)) val = val.slice(1, -1);
    else if (/^["']/.test(oldVal)) val = '"' + val.replace(/"/g, '\\"') + '"';
    state.front.set(key, { line: idx, value: val, text: prefix + val });
    markDirty(true);
  }

  function headChanged(el) {
    const sid = el.dataset.head;
    const s = findScene(sid);
    if (!s) return;
    const title = readField(el);
    const raw = rawLine(s.lineStart);
    const m = raw.match(/^(\s*#+\s*)/);
    const prefix = m ? m[1] : "### ";
    // 场次号固定，只有标题部分可改（附注标题【表演附注 6-1a】依赖它）
    state.heads.set(sid, { line: s.lineStart, title: title, text: prefix + s.id + " " + title });
    markDirty(true);
  }

  function addInsert(sid, kind) {
    const s = findScene(sid);
    if (!s) return;
    const id = "i" + (++state.insSeq);
    const rec = { id: id, kind: kind, anchor: insertAnchorFor(s), text: "" };
    if (!state.inserts.has(sid)) state.inserts.set(sid, []);
    state.inserts.get(sid).push(rec);
    markDirty(true);
    render();
    const el = document.querySelector('[data-ins="' + id + '"] .ins-input');
    if (el) el.focus();
  }

  /* =====================================================================
   * 保存
   * ===================================================================== */

  function describeOp(op) {
    const at = function (i) { return "第 " + (i + 1) + " 行"; };
    if (op.op === "replace_block") {
      let from, to;
      if (op.type === "note") {
        from = rawLine(op.lineStart + 1);
        to = op.text || "";
      } else {
        from = rawLine(op.lineStart);
        to = op.text || "";
        if (op.type === "dialogue") to = (op.who || "") + "：" + to;
        else if (op.type === "action") to = "△" + to;
      }
      return {
        tag: "改" + ({ dialogue: "台词", action: "动作", note: "附注", beat: "节拍" }[op.type] || "块"),
        at: at(op.lineStart), from: from, to: to,
      };
    }
    if (op.op === "delete_block") {
      return { tag: "删除", at: at(op.lineStart), from: rawLine(op.lineStart), to: "（删除）" };
    }
    if (op.op === "insert_after") {
      return { tag: "插入", at: "在 " + at(op.line) + "后", from: "", to: op.text || "" };
    }
    return { tag: "改行", at: at(op.line), from: rawLine(op.line), to: op.text || "" };
  }

  function openDiffPanel(wire) {
    const items = wire.map(describeOp);
    document.getElementById("diffList").innerHTML = items.map(function (it) {
      return '<div class="modal-item"><span class="op">' + escapeHtml(it.tag) + "</span>" +
        '<span class="dline">' + escapeHtml(it.at) + "</span>" +
        (it.from ? '<pre class="from">' + escapeHtml(it.from) + "</pre>" : "") +
        (it.to ? '<pre class="to">' + escapeHtml(it.to) + "</pre>" : "") +
        "</div>";
    }).join("");
    const deleted = countDeleted(buildOps(state), (state.parsed && state.parsed.lines) || []);
    document.getElementById("diffNote").textContent =
      "共 " + items.length + " 处改动" +
      (deleted.lines ? "，主动删除 " + deleted.lines + " 行" : "") +
      (deleted.notes ? "、" + deleted.notes + " 段附注" : "") +
      "。写回由服务端 core.py 统一落盘，并自动备份旧版。";
    document.getElementById("diffTitle").textContent = "保存前预览";
    document.getElementById("btnDiffOk").hidden = false;
    document.getElementById("btnDiffOk").textContent = "确认写回";
    document.getElementById("btnDiffCancel").textContent = "取消";
    document.getElementById("diffModal").classList.add("on");
  }

  function showResult(diff) {
    const items = (diff || []).filter(function (d) { return d.op !== "same"; });
    document.getElementById("diffList").innerHTML = items.length
      ? items.map(function (d) {
          return '<div class="modal-item"><span class="op">' + (d.op === "add" ? "新增" : "删除") + "</span>" +
            '<span class="dline">第 ' + ((d.line || 0) + 1) + " 行</span>" +
            '<pre class="' + (d.op === "add" ? "to" : "from") + '">' +
            escapeHtml(d.op === "add" ? (d.new || "") : (d.old || "")) + "</pre></div>";
        }).join("")
      : '<div class="modal-item">文件内容没有变化。</div>';
    const add = items.filter(function (d) { return d.op === "add"; }).length;
    const del = items.filter(function (d) { return d.op === "del"; }).length;
    document.getElementById("diffNote").textContent =
      "新增 " + add + " 行，删除 " + del + " 行。旧版已备份到 preview/.backups/。";
    document.getElementById("diffTitle").textContent = "写回结果";
    document.getElementById("btnDiffOk").hidden = true;
    document.getElementById("btnDiffCancel").textContent = "关闭";
    document.getElementById("diffModal").classList.add("on");
  }

  function closeDiffPanel() {
    const m = document.getElementById("diffModal");
    if (m) m.classList.remove("on");
  }

  function saveToDisk() {
    const ep = current();
    if (!ep) return;
    if (state.offline) {
      toast("未连接本地服务，无法写回。请运行 python preview/server.py", "err");
      return;
    }
    const raw = buildOps(state);
    if (!raw.length) {
      toast("无改动", "");
      return;
    }
    const problems = checkOverlap(raw);
    if (problems.length) {
      toast("改动区间冲突：" + problems.join("；"), "err");
      return;
    }
    // 插入的台词必须是「角色：台词」
    let bad = "";
    state.inserts.forEach(function (list) {
      list.forEach(function (rec) {
        if (bad || rec.kind === "action") return;
        const t = String(rec.text || "").trim();
        if (!t) return;
        if (t.indexOf("：") < 0 && t.indexOf(":") < 0) bad = "插入的台词要写成「角色：台词」";
      });
    });
    if (bad) {
      toast(bad, "err");
      return;
    }
    state.pendingWire = toWire(raw);
    openDiffPanel(state.pendingWire);
  }

  async function doSave(wire) {
    const ep = current();
    if (!ep) return;
    const btn = document.getElementById("btnSave");
    btn.disabled = true;
    try {
      const res = await fetch("/api/save", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({
          id: ep.id,
          ops: wire,
          deleted: countDeleted(buildOps(state), (state.parsed && state.parsed.lines) || []),
        }),
      });
      const data = await res.json().catch(function () { return {}; });
      // 服务端是权威：400 的原因直接显示，不在前端重复判定
      if (!res.ok || data.error) throw new Error(data.error || ("HTTP " + res.status));
      if (Array.isArray(data.episodes) && data.episodes.length) state.episodes = data.episodes;
      resetEdits();
      markDirty(false);
      // 落盘后行号会变 → 重新拉一次解析结果
      await loadParsed(ep.id);
      render();
      if (Array.isArray(data.diff)) {
        showResult(data.diff);
        toast("已写回 " + ep.id + ".md", "ok");
      } else {
        closeDiffPanel();
        toast("已写回 " + ep.id + ".md", "ok");
      }
    } catch (e) {
      toast("保存失败：" + e.message, "err");
      btn.disabled = false;
    }
  }

  async function loadParsed(id) {
    // file:// 打开时直接走本地回退，不去发注定失败的 fetch
    if (!canReachServer()) {
      const ep0 = state.episodes.find(function (x) { return x.id === id; });
      if (ep0 && ep0.markdown) {
        try {
          state.parsed = parseLocal(ep0.markdown);
          state.parsed.meta = ep0.meta || state.parsed.meta || {};
          if (!state.parsed.lines) state.parsed.lines = [];
        } catch (e) {
          state.parsed = null;
        }
      }
      state.offline = true;
      return false;
    }
    try {
      const res = await fetch("/api/parse?id=" + encodeURIComponent(id));
      if (!res.ok) throw new Error("HTTP " + res.status);
      const data = await res.json();
      if (!data || !data.parsed) throw new Error("解析结果为空");
      state.parsed = data.parsed;
      state.parsed.meta = state.parsed.meta || data.meta || {};
      if (!state.parsed.lines) state.parsed.lines = [];
      state.offline = false;
      return true;
    } catch (e) {
      // 服务端没有 /api/parse（旧版 server.py）或 file:// 打开 → 退回内嵌数据，只读
      const ep = state.episodes.find(function (x) { return x.id === id; });
      if (ep && ep.markdown) {
        state.parsed = parseLocal(ep.markdown);
        state.parsed.meta = ep.meta || state.parsed.meta || {};
        state.offline = true;
        return false;
      }
      state.offline = true;
      return false;
    }
  }

  async function reloadFromDisk() {
    const ep = current();
    if (!ep) return;
    if (state.dirty && !window.confirm("重新载入会丢弃未保存的改动，继续？")) return;
    if (!canReachServer()) {
      toast("file:// 打开时读不到磁盘，请运行 python preview/server.py", "err");
      return;
    }
    try {
      const res = await fetch("/api/episodes");
      const data = await res.json();
      if (!res.ok || data.error) throw new Error(data.error || ("HTTP " + res.status));
      if (Array.isArray(data.episodes) && data.episodes.length) state.episodes = data.episodes;
      resetEdits();
      markDirty(false);
      await loadParsed(ep.id);
      render();
      toast("已从磁盘重新载入", "ok");
    } catch (e) {
      state.offline = true;
      toast("无法连接本地服务（" + e.message + "）", "err");
      updateEditHint();
    }
  }

  function resetEdits() {
    state.blocks.clear();
    state.front.clear();
    state.heads.clear();
    state.inserts.clear();
    state.pendingWire = [];
  }

  function updateEditHint() {
    const h = document.getElementById("editHint");
    const b = document.getElementById("btnSave");
    if (!h) return;
    if (state.offline) {
      h.innerHTML = "未连接本地服务（只读）。<br>要写回文档请运行：<code>python preview/server.py</code>";
      if (b) b.disabled = true;
    } else {
      h.textContent = state.editing
        ? "改完点「保存到文档」写回 episodes/*.md（保存前会先看改动预览）"
        : "进入编辑后可改台词、动作、附注、场次标题与 frontmatter";
      if (b) b.disabled = !state.editing;
    }
  }

  function markDirty(on) {
    const n = buildOps(state).length;
    state.dirty = on && n > 0;
    const f = document.getElementById("dirtyFlag");
    if (f) f.textContent = state.dirty ? "● 有未保存改动（" + n + " 处）" : "";
    const b = document.getElementById("btnSave");
    // 编辑态下按钮始终可点：没有改动时点它会提示「无改动」（而不是灰着让人猜）
    if (b) b.disabled = state.offline || !state.editing;
    const u = document.getElementById("btnUndo");
    if (u) u.disabled = !state.dirty;
  }

  function toggleEdit() {
    if (!state.editing && state.offline) {
      toast("未连接本地服务，只读模式。要写回请运行 python preview/server.py", "err");
      return;
    }
    if (state.editing && state.dirty && !window.confirm("退出编辑会丢弃未保存的改动，继续？")) return;
    state.editing = !state.editing;
    document.body.classList.toggle("editing", state.editing);
    const b = document.getElementById("btnEdit");
    if (b) b.textContent = state.editing ? "退出编辑" : "进入编辑";
    const q = document.getElementById("q");
    if (q) q.disabled = state.editing;
    const fh = document.getElementById("filterHint");
    if (fh) fh.hidden = !state.editing;
    if (!state.editing) {
      resetEdits();
      markDirty(false);
    }
    updateEditHint();
    render();
  }

  function undoAll() {
    resetEdits();
    markDirty(false);
    render();
    toast("已撤销本次改动", "ok");
  }

  /* =====================================================================
   * 启动
   * ===================================================================== */

  function fillSelect() {
    const sel = document.getElementById("epSelect");
    sel.innerHTML = state.episodes.map(function (e) {
      return '<option value="' + escapeHtml(e.id) + '">' + escapeHtml(e.id) + " · " +
        escapeHtml((e.meta && e.meta.title) || e.id) + "</option>";
    }).join("");
    sel.value = state.epId || "";
  }

  async function selectEpisode(id) {
    if (state.dirty && !window.confirm("切换集会丢弃未保存的改动，继续？")) return;
    state.epId = id;
    state.roles.clear();
    resetEdits();
    markDirty(false);
    await loadParsed(id);
    render();
  }

  function init() {
    state.episodes = (typeof EMBEDDED_EPISODES !== "undefined" ? EMBEDDED_EPISODES : []).slice();
    state.epId = state.episodes.length ? state.episodes[0].id : null;

    const sel = document.getElementById("epSelect");
    fillSelect();
    sel.addEventListener("change", function () { selectEpisode(sel.value); });

    document.getElementById("viewMode").addEventListener("click", function (ev) {
      const btn = ev.target.closest("button[data-view]");
      if (!btn) return;
      state.view = btn.dataset.view;
      Array.prototype.forEach.call(document.getElementById("viewMode").querySelectorAll("button"), function (b) {
        b.classList.toggle("active", b === btn);
      });
      render();
    });

    document.getElementById("q").addEventListener("input", function (ev) {
      state.query = ev.target.value;
      render();
    });

    document.getElementById("roleChips").addEventListener("click", function (ev) {
      const btn = ev.target.closest("[data-role]");
      if (!btn || btn.disabled) return;
      const r = btn.dataset.role;
      if (r === "__all") state.roles.clear();
      else {
        if (state.roles.has(r)) state.roles.delete(r);
        else state.roles.add(r);
      }
      render();
    });

    document.getElementById("sceneNav").addEventListener("click", function (ev) {
      const a = ev.target.closest("a[data-sid]");
      if (!a) return;
      ev.preventDefault();
      const el = document.getElementById("scene-" + a.dataset.sid);
      if (el) el.scrollIntoView({ behavior: "smooth", block: "start" });
    });

    document.getElementById("btnEdit").addEventListener("click", toggleEdit);
    document.getElementById("btnSave").addEventListener("click", saveToDisk);
    document.getElementById("btnReload").addEventListener("click", reloadFromDisk);
    document.getElementById("btnUndo").addEventListener("click", undoAll);
    document.getElementById("btnDiffCancel").addEventListener("click", closeDiffPanel);
    document.getElementById("btnDiffOk").addEventListener("click", function () {
      const wire = state.pendingWire || [];
      closeDiffPanel();
      doSave(wire);
    });

    // 编辑输入
    document.getElementById("main").addEventListener("input", function (ev) {
      if (!state.editing) return;
      const t = ev.target;
      if (t.dataset && t.dataset.front) { frontChanged(t); return; }
      if (t.dataset && t.dataset.head) { headChanged(t); return; }
      if (t.classList && t.classList.contains("ins-input")) { insertChanged(t); return; }
      const blk = t.closest && t.closest("[data-bk]");
      if (blk) blockChanged(blk);
    });

    // 点击：插入 / 删除 / 恢复
    document.getElementById("main").addEventListener("click", function (ev) {
      const add = ev.target.closest("[data-add]");
      if (add) {
        ev.preventDefault();
        addInsert(add.dataset.sid, add.dataset.add);
        return;
      }
      const del = ev.target.closest("[data-del]");
      if (del) {
        ev.preventDefault();
        const key = del.dataset.del;
        const b = findBlockByKey(key);
        if (!b) return;
        const rec = ensureBlockRec(b);
        rec.deleted = true;
        markDirty(true);
        render();
        return;
      }
      const undel = ev.target.closest("[data-undel]");
      if (undel) {
        ev.preventDefault();
        const key = undel.dataset.undel;
        const rec = state.blocks.get(key);
        if (rec) rec.deleted = false;
        markDirty(true);
        render();
      }
    });

    // 离开页面前提醒未保存
    window.addEventListener("beforeunload", function (ev) {
      if (!state.dirty) return;
      ev.preventDefault();
      ev.returnValue = "";
    });

    // 首次加载：优先走服务端 /api/parse，拿不到就退回内嵌数据（只读）
    (async function boot() {
      if (canReachServer()) {
        try {
          const res = await fetch("/api/episodes");
          const data = await res.json();
          if (res.ok && Array.isArray(data.episodes) && data.episodes.length) {
            state.episodes = data.episodes;
            fillSelect();
          }
        } catch (e) {
          state.offline = true;
        }
      } else {
        // file:// 打开：直接用内嵌数据，不发注定失败的请求
        state.offline = true;
      }
      if (state.epId) await loadParsed(state.epId);
      updateEditHint();
      render();
    })();
  }

  init();
})();
</script>
</body>
</html>
